openapi: 3.0.3
info:
  title: Spacefleet API
  version: 0.1.0
  description: |
    HTTP API for the Spacefleet app. This is the source of truth: it
    generates the Go server stubs (lib/api/gen.go) and the TypeScript
    client types (ui/src/api/schema.d.ts). Run `make gen` after editing.

    Account management is organization-centric: organizations are the
    top-level tenant and a user must belong to (and have selected) one to use
    the app. /api/me bootstraps the SPA with the current user and their
    organization memberships.
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/me:
    get:
      summary: The current user and their organization memberships
      description: |
        Returns the authenticated user, provisioning a local record on first
        sight, along with the organizations they belong to. The SPA uses this
        to bootstrap: an empty organizations list means the user must create
        one before using the app.
      operationId: getMe
      responses:
        "200":
          description: Current user and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /api/organizations:
    post:
      summary: Create an organization (the caller becomes its first admin)
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /api/organizations/{id}:
    patch:
      summary: Rename an organization (admins only)
      operationId: renameOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /api/members:
    get:
      summary: List the members of the current organization
      description: |
        Org-scoped (X-Organization-ID). Any member may view the roster; only
        admins can change roles or remove members.
      operationId: listMembers
      responses:
        "200":
          description: Members of the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"

  /api/members/{userId}:
    patch:
      summary: Change a member's role (admins only)
      description: |
        Org-scoped (X-Organization-ID). Admin-only. The organization must keep
        at least one admin, so demoting the last admin is rejected with 409.
      operationId: updateMemberRole
      parameters:
        - $ref: "#/components/parameters/MemberUserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdateRequest"
      responses:
        "200":
          description: The updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove a member from the organization (admins only)
      description: |
        Org-scoped (X-Organization-ID). Admin-only. The organization must keep
        at least one admin, so removing the last admin is rejected with 409.
      operationId: removeMember
      parameters:
        - $ref: "#/components/parameters/MemberUserID"
      responses:
        "204":
          description: Member removed
        default:
          $ref: "#/components/responses/Error"

  /api/invitations:
    get:
      summary: List pending invitations for the current organization (admins only)
      description: Org-scoped (X-Organization-ID). Admin-only.
      operationId: listInvitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Invite a user to the current organization (admins only)
      description: |
        Org-scoped (X-Organization-ID). Admin-only. Creates a pending invitation
        and returns a copy-able accept link. When email is configured an
        invitation email is also sent (email_sent reflects whether it was
        enqueued); otherwise the admin shares the link manually.
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreateResult"
        default:
          $ref: "#/components/responses/Error"

  /api/invitations/{id}:
    delete:
      summary: Revoke a pending invitation (admins only)
      description: Org-scoped (X-Organization-ID). Admin-only. Invalidates the invite link.
      operationId: revokeInvitation
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Invitation revoked
        default:
          $ref: "#/components/responses/Error"

  /api/invites/{token}:
    get:
      summary: Preview an invitation by its token
      description: |
        Token-scoped (not org-scoped). Returns what the invite is for so the
        accept screen can show the organization and role, and whether the link
        is still usable. Requires a signed-in user.
      operationId: getInvitation
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: The invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        default:
          $ref: "#/components/responses/Error"

  /api/invites/{token}/accept:
    post:
      summary: Accept an invitation and join its organization
      description: |
        Token-scoped (not org-scoped). The signed-in user joins the invitation's
        organization with the invitation's role; the token is the sole authority
        (the invited email is not checked against the caller). Idempotent for a
        user who already belongs to the organization. Returns the joined
        organization so the SPA can select it.
      operationId: acceptInvitation
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: The organization the user joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters:
    get:
      summary: List the clusters registered to the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Secret credentials are never included in the response.
      operationId: listClusters
      responses:
        "200":
          description: Clusters in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register a Kubernetes cluster in the current organization
      description: |
        Stores the connection details (credentials are envelope-encrypted at
        rest) and immediately probes the cluster, returning it with the
        resulting connection status.
      operationId: createCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterCreateRequest"
      responses:
        "201":
          description: Cluster registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}:
    get:
      summary: Get a cluster
      operationId: getCluster
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a cluster (name and/or credentials)
      description: |
        Updates the cluster's name and/or re-supplies credentials. The
        connection method is fixed at registration. Supplying any credential
        field re-encrypts and re-probes.
      operationId: updateCluster
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterUpdateRequest"
      responses:
        "200":
          description: Cluster updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a cluster
      operationId: deleteCluster
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "204":
          description: Cluster deleted
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/test:
    post:
      summary: Re-probe a cluster's connectivity
      description: Rebuilds the client from stored credentials and refreshes the connection status.
      operationId: testCluster
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster with refreshed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/nodes:
    get:
      summary: List the Kubernetes nodes of a cluster
      description: |
        Org-scoped: builds a client from the cluster's stored credentials and
        lists its nodes live from the Kubernetes API. The cluster must be
        reachable; an unreachable cluster yields a 502.
      operationId: listClusterNodes
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/namespaces:
    get:
      summary: List the Kubernetes namespaces of a cluster
      description: |
        Org-scoped: builds a client from the cluster's stored credentials and
        lists its namespaces live from the Kubernetes API. The cluster must be
        reachable; an unreachable cluster yields a 502.
      operationId: listClusterNamespaces
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's namespaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Namespace"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/pods:
    get:
      summary: List the Kubernetes pods of a cluster
      description: |
        Org-scoped: builds a client from the cluster's stored credentials and
        lists its pods across all namespaces live from the Kubernetes API. The
        cluster must be reachable; an unreachable cluster yields a 502.
      operationId: listClusterPods
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's pods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pod"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/releases:
    get:
      summary: List the Helm releases installed on a cluster
      description: |
        Org-scoped: builds a client from the cluster's stored credentials and
        lists the Helm releases installed on it, decoded from the release Secrets
        Helm writes (the default `secret` storage driver). Only the newest
        revision of each release is returned. This is the discovery step behind
        importing an existing release as an application. The cluster must be
        reachable; an unreachable cluster yields a 502.
      operationId: listClusterReleases
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - name: namespace
          in: query
          required: false
          description: |
            Restrict discovery to one namespace. Omit to list releases across all
            namespaces.
          schema:
            type: string
      responses:
        "200":
          description: The cluster's Helm releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelmRelease"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/capabilities:
    get:
      summary: Report the cluster credentials' access (capabilities)
      description: |
        Org-scoped: builds a client from the cluster's stored credentials,
        resolves the identity they map to, and checks — live against the
        Kubernetes API — which product capabilities the credentials are allowed.
        Each capability is reported as allowed or denied; denied capabilities
        carry the missing RBAC rules that explain why. To grant a selection of
        capabilities, generate a manifest via the capabilities/rbac endpoint. The
        cluster must be reachable; an unreachable cluster yields a 502.
      operationId: listClusterCapabilities
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster credentials' capability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterCapabilities"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/capabilities/rbac:
    post:
      summary: Generate an RBAC manifest for selected capabilities
      description: |
        Org-scoped: builds a single ClusterRole + ClusterRoleBinding granting the
        complete rule set the selected capabilities require, bound to the identity
        the cluster's stored credentials resolve to. Unlike the capability report
        (which only describes what is currently missing), this grants each
        selected capability's full rule set so the manifest is self-contained
        regardless of what is already allowed. For connection
        methods with no addressable in-cluster subject (kubeconfig, eks, gke, aks)
        it returns best-effort guidance rather than a directly applicable manifest.
      operationId: generateClusterRbac
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRbacRequest"
      responses:
        "200":
          description: The generated RBAC manifest (or guidance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterRbac"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton:
    get:
      summary: Report a cluster's Tekton (job-running) status
      description: |
        Org-scoped: returns whether the cluster is designated to run jobs and the
        Tekton install lifecycle, reconciled with a live presence detection
        (whether Tekton is installed and the controller is ready). An unreachable
        cluster yields a 502. Live install progress is available as a stream at
        /api/clusters/{id}/tekton/stream.
      operationId: getClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's Tekton status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/enable:
    post:
      summary: Designate a cluster to run jobs (install Tekton)
      description: |
        Org-scoped, editor or above. Marks the cluster as a job runner and, when
        Tekton isn't installed yet, enqueues a background job that installs the
        pinned Tekton release into the cluster. Returns immediately (202); follow
        progress via the Tekton status stream.
      operationId: enableClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "202":
          description: Enable accepted; install (if needed) is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/disable:
    post:
      summary: Stop designating a cluster as a job runner
      description: |
        Org-scoped, editor or above. Clears the job-runner flag. It does not
        uninstall Tekton from the cluster.
      operationId: disableClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's Tekton status after disabling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/upgrade:
    post:
      summary: Upgrade a Spacefleet-managed Tekton install
      description: |
        Org-scoped, editor or above. Re-applies the pinned Tekton release to a
        cluster whose Tekton was installed by Spacefleet, bringing it to the
        pinned version (and repairing a failed/partial install). Only available
        when the install is Spacefleet-managed; returns 409 otherwise, and 409
        if Tekton is not installed. Returns immediately (202); follow progress
        via the Tekton status stream.
      operationId: upgradeClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "202":
          description: Upgrade accepted; the upgrade job is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/uninstall:
    post:
      summary: Remove a Spacefleet-managed Tekton install
      description: |
        Org-scoped, editor or above. Removes the Tekton release Spacefleet
        installed (and clears the job-runner flag). Only available when the
        install is Spacefleet-managed; returns 409 for a Tekton installed
        outside Spacefleet, which is never removed. Returns immediately (202);
        follow progress via the Tekton status stream.
      operationId: uninstallClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "202":
          description: Uninstall accepted; the uninstall job is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/runs:
    post:
      summary: Submit a job (TaskRun) to a cluster
      description: |
        Org-scoped, editor or above. Submits a minimal single-step TaskRun and
        returns its initial status. Watch its status at
        /api/clusters/{id}/tekton/runs/{name}/stream and its logs via the pod-log
        stream once a pod name is reported.
      operationId: submitClusterTektonRun
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TektonRunRequest"
      responses:
        "201":
          description: The submitted run's initial status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonRun"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/runs/{name}:
    get:
      summary: Get a job (TaskRun) status
      description: "Org-scoped: returns the current status of one TaskRun by name."
      operationId: getClusterTektonRun
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - name: name
          in: path
          required: true
          description: The TaskRun name.
          schema:
            type: string
      responses:
        "200":
          description: The run's current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonRun"
        default:
          $ref: "#/components/responses/Error"

  /api/runs:
    get:
      summary: List all workflow runs in the current organization
      description: |
        Org-scoped. Returns workflow runs across every application in the
        organization, newest-first, for a global deploy-history view. The list is
        capped (newest runs); filtering by application or cluster is done by the
        client. Each run carries its application_id; component runs and the graph
        snapshot are not included — fetch a single run for those. A live stream of
        the same list is available at /api/runs/stream (Server-Sent Events).
      operationId: listAllRuns
      responses:
        "200":
          description: The organization's workflow runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        default:
          $ref: "#/components/responses/Error"

  /api/applications:
    get:
      summary: List the applications in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
      operationId: listApplications
      responses:
        "200":
          description: Applications in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register an application in the current organization
      description: |
        Org-scoped, editor or above. Persists the application in the pending
        state; it does not start a rollout (POST .../rollout for that).
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateRequest"
      responses:
        "201":
          description: Application registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/import:
    post:
      summary: Adopt an existing Helm release as an application
      description: |
        Org-scoped, editor or above. Adopts a release already running on the
        target cluster (discovered via GET /api/clusters/{id}/releases) as a
        managed application, seeded with the release's live values. The release
        is already deployed, so this does NOT run a rollout — the application is
        created in the deployed state. When the background worker is available it
        immediately enqueues a refresh (a `helm diff`) so the sync status shows
        whether the configured chart source reproduces the live release. Returns
        202 (the app, with the refresh in flight when enqueued).
      operationId: importApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationImportRequest"
      responses:
        "202":
          description: Application adopted; a refresh is in progress when enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}:
    get:
      summary: Get an application
      operationId: getApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update an application
      description: |
        Org-scoped, editor or above. Updates mutable fields (name, chart
        coordinates, values, release name, target namespace). The clusters and
        chart source are fixed at registration.
      operationId: updateApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdateRequest"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an application
      operationId: deleteApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "204":
          description: Application deleted
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/group:
    put:
      summary: Move an application into a group (or to the org root)
      description: |
        Org-scoped, editor or above. Sets the application's group membership. The
        request's group_id is always present: a uuid moves the application into
        that group (which must belong to the same organization), and null removes
        it from any group (back to the org root).
      operationId: setApplicationGroup
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationGroupAssignment"
      responses:
        "200":
          description: Application moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"

  /api/application-groups:
    get:
      summary: List the application groups in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
      operationId: listApplicationGroups
      responses:
        "200":
          description: Application groups in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationGroup"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Create an application group
      description: |
        Org-scoped, editor or above. Group names are unique within the org.
      operationId: createApplicationGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationGroupCreateRequest"
      responses:
        "201":
          description: Application group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationGroup"
        default:
          $ref: "#/components/responses/Error"

  /api/application-groups/{id}:
    get:
      summary: Get an application group
      operationId: getApplicationGroup
      parameters:
        - $ref: "#/components/parameters/ApplicationGroupID"
      responses:
        "200":
          description: The application group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationGroup"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Rename an application group
      description: |
        Org-scoped, editor or above. Only the name is mutable.
      operationId: updateApplicationGroup
      parameters:
        - $ref: "#/components/parameters/ApplicationGroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationGroupUpdateRequest"
      responses:
        "200":
          description: Application group updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationGroup"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an application group
      description: |
        Org-scoped, editor or above. The group's applications are not deleted —
        they fall back to the org root (ungrouped).
      operationId: deleteApplicationGroup
      parameters:
        - $ref: "#/components/parameters/ApplicationGroupID"
      responses:
        "204":
          description: Application group deleted
        default:
          $ref: "#/components/responses/Error"

  /api/application-groups/{id}/variables:
    get:
      summary: List an application group's variables
      description: |
        Org-scoped. Group variables are passed to the component jobs of every
        application in the group as environment variables, at the lowest priority
        — an application's own variable of the same name overrides a group
        variable, and a component-level one overrides that. A sensitive
        variable's value is sealed and never returned (only `sensitive: true` and
        the name).
      operationId: listGroupVariables
      parameters:
        - $ref: "#/components/parameters/ApplicationGroupID"
      responses:
        "200":
          description: The group's variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a group variable
      description: |
        Org-scoped, editor or above. A sensitive variable's value is sealed at
        rest and never returned (requires an encryption key,
        SPACEFLEET_SECRET_KEY). Names are a shell-safe identifier and unique
        among the group's variables.
      operationId: createGroupVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationGroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableCreateRequest"
      responses:
        "201":
          description: Variable created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"

  /api/application-groups/{id}/variables/{variableId}:
    patch:
      summary: Update a group variable
      description: |
        Org-scoped, editor or above. Renames and/or replaces the value. Omit
        `value` to leave it unchanged (the only way to keep a sensitive value,
        which is never returned). The sensitive flag is fixed at creation.
      operationId: updateGroupVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationGroupID"
        - $ref: "#/components/parameters/VariableID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableUpdateRequest"
      responses:
        "200":
          description: Variable updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a group variable
      operationId: deleteGroupVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationGroupID"
        - $ref: "#/components/parameters/VariableID"
      responses:
        "204":
          description: Variable deleted
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/workflow:
    get:
      summary: Get an application's deploy workflow (its component graph)
      description: |
        Org-scoped. Returns the application's workflow as the list of its
        components (the DAG nodes; edges are each node's depends_on). Secret-
        bearing component config (the Helm `values` override) is redacted for
        callers below editor.
      operationId: getApplicationWorkflow
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The application's workflow components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        default:
          $ref: "#/components/responses/Error"
    put:
      summary: Replace an application's deploy workflow
      description: |
        Org-scoped, editor or above. Validates the proposed DAG (distinct
        non-zero ids, dependencies exist, no self-dependency, acyclic, per-type
        config valid) and atomically replaces the application's components with
        it. A validation failure returns 400 before any write.
      operationId: replaceApplicationWorkflow
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowReplaceRequest"
      responses:
        "200":
          description: The replaced workflow components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/variables:
    get:
      summary: List an application's app-level variables
      description: |
        Org-scoped. App-level variables are passed to every component job of the
        application as environment variables. A sensitive variable's value is
        sealed and never returned (only `sensitive: true` and the name).
      operationId: listApplicationVariables
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The application's app-level variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add an app-level variable
      description: |
        Org-scoped, editor or above. A sensitive variable's value is sealed at
        rest and never returned (requires an encryption key,
        SPACEFLEET_SECRET_KEY). Names are a shell-safe identifier and unique
        among the application's app-level variables.
      operationId: createApplicationVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableCreateRequest"
      responses:
        "201":
          description: Variable created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/variables/{variableId}:
    patch:
      summary: Update an app-level variable
      description: |
        Org-scoped, editor or above. Renames and/or replaces the value. Omit
        `value` to leave it unchanged (the only way to keep a sensitive value,
        which is never returned). The sensitive flag is fixed at creation.
      operationId: updateApplicationVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/VariableID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableUpdateRequest"
      responses:
        "200":
          description: Variable updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an app-level variable
      operationId: deleteApplicationVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/VariableID"
      responses:
        "204":
          description: Variable deleted
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/components/{componentId}/variables:
    get:
      summary: List a component's variables
      description: |
        Org-scoped. Component-level variables are passed to that one component's
        job and override an app-level variable of the same name. A sensitive
        variable's value is sealed and never returned.
      operationId: listComponentVariables
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
      responses:
        "200":
          description: The component's variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a component-level variable
      description: |
        Org-scoped, editor or above. Overrides an app-level variable of the same
        name for this component. A sensitive variable's value is sealed at rest
        and never returned. The component must already exist (save the workflow
        first). Names are unique among the component's variables.
      operationId: createComponentVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableCreateRequest"
      responses:
        "201":
          description: Variable created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/components/{componentId}/variables/{variableId}:
    patch:
      summary: Update a component-level variable
      description: |
        Org-scoped, editor or above. Renames and/or replaces the value. Omit
        `value` to leave it unchanged. The sensitive flag is fixed at creation.
      operationId: updateComponentVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
        - $ref: "#/components/parameters/VariableID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableUpdateRequest"
      responses:
        "200":
          description: Variable updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a component-level variable
      operationId: deleteComponentVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
        - $ref: "#/components/parameters/VariableID"
      responses:
        "204":
          description: Variable deleted
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs:
    get:
      summary: List an application's workflow runs
      description: |
        Org-scoped. Returns the application's workflow runs newest-first — one
        per deploy/uninstall/preview of the whole DAG — for a CI-like history.
        Component runs and the graph snapshot are not included here; fetch a
        single run for those.
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The application's workflow runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Start a workflow run (deploy, uninstall, or preview)
      description: |
        Org-scoped, editor or above. Snapshots the current workflow graph,
        creates a run plus one component run per node, and enqueues the
        background job that executes it. Returns immediately (202); follow
        progress via the run stream. Requires the background worker (503
        otherwise). Returns 409 while a run is already in flight for the app.
      operationId: startRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStartRequest"
      responses:
        "202":
          description: Run accepted; the job is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}/cancel:
    post:
      summary: Cancel an in-flight workflow run
      description: |
        Org-scoped, editor or above. Marks an in-flight (pending or running) run
        failed and settles its non-terminal component runs, clearing the
        application's in-flight gate so a new run can start. Returns 409 if the
        run is already terminal (nothing to cancel). The background executor's
        own retries short-circuit on the now-terminal rows, so cancellation is a
        durable stop, not just a UI affordance.
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The cancelled run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}:
    get:
      summary: Get one workflow run, with its component runs and graph snapshot
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The workflow run, its component runs, and the graph snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunDetail"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}/components/{componentRunId}:
    get:
      summary: Get one component run within a workflow run, with its logs
      operationId: getComponentRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/ComponentRunID"
      responses:
        "200":
          description: The component run, including its captured logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentRunDetail"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}/components/{componentRunId}/approve:
    post:
      summary: Approve a workflow run's manual-approval gate
      description: |
        Org-scoped, editor or above. Approves a step parked at awaiting_approval
        so the run resumes and the gated node runs. Returns 409 if the step is
        not awaiting approval (nothing to decide) and 503 if the background
        worker is not configured. The approver's identity is recorded on the
        component run.
      operationId: approveComponentRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/ComponentRunID"
      responses:
        "200":
          description: The run, resuming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}/components/{componentRunId}/reject:
    post:
      summary: Reject a workflow run's manual-approval gate
      description: |
        Org-scoped, editor or above. Rejects a step parked at awaiting_approval:
        the step settles failed and the run resumes to settle (its dependents
        skip). Returns 409 if the step is not awaiting approval and 503 if the
        background worker is not configured. The rejector's identity is recorded
        on the component run.
      operationId: rejectComponentRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/ComponentRunID"
      responses:
        "200":
          description: The run, resuming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/chart-credentials:
    get:
      summary: List the chart credentials in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Credentials for pulling private Helm charts ("Private Charts"). The
        password is never returned.
      operationId: listChartCredentials
      responses:
        "200":
          description: Chart credentials in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartCredential"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register a chart credential in the current organization
      description: |
        Org-scoped, editor or above. The password is sealed at rest and never
        returned. Requires an encryption key (SPACEFLEET_SECRET_KEY).
      operationId: createChartCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartCredentialCreateRequest"
      responses:
        "201":
          description: Chart credential registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCredential"
        default:
          $ref: "#/components/responses/Error"

  /api/chart-credentials/{id}:
    get:
      summary: Get a chart credential
      operationId: getChartCredential
      parameters:
        - $ref: "#/components/parameters/ChartCredentialID"
      responses:
        "200":
          description: The chart credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCredential"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a chart credential
      description: |
        Org-scoped, editor or above. Updates the name, username, and/or
        password. The type is fixed at registration.
      operationId: updateChartCredential
      parameters:
        - $ref: "#/components/parameters/ChartCredentialID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartCredentialUpdateRequest"
      responses:
        "200":
          description: Chart credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCredential"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a chart credential
      description: |
        Org-scoped, editor or above. A credential still attached to an
        application cannot be deleted (409).
      operationId: deleteChartCredential
      parameters:
        - $ref: "#/components/parameters/ChartCredentialID"
      responses:
        "204":
          description: Chart credential deleted
        default:
          $ref: "#/components/responses/Error"

  /api/cloud-credentials:
    get:
      summary: List the cloud credentials in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Cloud-provider credentials (AWS, GCP, Azure) used to authenticate to a
        cloud. The sealed secret material is never returned.
      operationId: listCloudCredentials
      responses:
        "200":
          description: Cloud credentials in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CloudCredential"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register a cloud credential in the current organization
      description: |
        Org-scoped, editor or above. The secret material is sealed at rest and
        never returned. Requires an encryption key (SPACEFLEET_SECRET_KEY). An
        organization may register many credentials, including several of the
        same provider; names are unique within the organization.
      operationId: createCloudCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudCredentialCreateRequest"
      responses:
        "201":
          description: Cloud credential registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCredential"
        default:
          $ref: "#/components/responses/Error"

  /api/cloud-credentials/{id}:
    get:
      summary: Get a cloud credential
      operationId: getCloudCredential
      parameters:
        - $ref: "#/components/parameters/CloudCredentialID"
      responses:
        "200":
          description: The cloud credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCredential"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a cloud credential
      description: |
        Org-scoped, editor or above. Updates the name, description, and/or the
        credential material. Supplying any credential field re-encrypts the
        secret. The provider is fixed at registration.
      operationId: updateCloudCredential
      parameters:
        - $ref: "#/components/parameters/CloudCredentialID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudCredentialUpdateRequest"
      responses:
        "200":
          description: Cloud credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCredential"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a cloud credential
      operationId: deleteCloudCredential
      parameters:
        - $ref: "#/components/parameters/CloudCredentialID"
      responses:
        "204":
          description: Cloud credential deleted
        default:
          $ref: "#/components/responses/Error"

  /api/github/installations:
    get:
      summary: List the GitHub App installations in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Installations of the operator's GitHub App, used to pull charts from
        private Git repositories.
      operationId: listGitHubInstallations
      responses:
        "200":
          description: GitHub installations in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Record a GitHub App installation from the connect callback
      description: |
        Org-scoped, editor or above. Called by the SPA after GitHub redirects
        back from the install flow. The state token (issued by connect-url) is
        verified to bind the installation to the initiating organization, and the
        installation is confirmed against the GitHub App before it is recorded.
      operationId: createGitHubInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubInstallationCreateRequest"
      responses:
        "201":
          description: Installation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"

  /api/github/repositories:
    get:
      summary: List repositories reachable across the organization's GitHub installations
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Aggregates the repositories every one of the organization's GitHub App
        installations can reach, each tagged with the installation it came from,
        so the workflow editor can offer a single quick-pick list. An
        installation that can't be read is skipped rather than failing the list.
      operationId: listGitHubRepositories
      responses:
        "200":
          description: Repositories across the organization's installations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubRepository"
        default:
          $ref: "#/components/responses/Error"

  /api/github/installations/connect-url:
    get:
      summary: Get the GitHub App install URL to begin connecting
      description: |
        Org-scoped, editor or above. Returns the URL to redirect the browser to
        so the user can install the operator's GitHub App. It carries a signed,
        short-lived state token binding the flow to the current organization,
        which the create endpoint verifies on the callback.
      operationId: getGitHubConnectUrl
      responses:
        "200":
          description: The install URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnectUrl"
        default:
          $ref: "#/components/responses/Error"

  /api/github/installations/{id}:
    delete:
      summary: Delete a GitHub App installation
      description: |
        Org-scoped, editor or above. An installation still attached to an
        application cannot be deleted (409). This removes the record from
        Spacefleet only; it does not uninstall the App on GitHub.
      operationId: deleteGitHubInstallation
      parameters:
        - $ref: "#/components/parameters/GitHubInstallationID"
      responses:
        "204":
          description: Installation deleted
        default:
          $ref: "#/components/responses/Error"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string

    Role:
      type: string
      description: |
        A member's role within an organization (hierarchical: admin > editor >
        viewer). admin manages the organization itself (members, invitations,
        renaming); editor can take any action within the app but not manage the
        org; viewer is read-only.
      enum: [admin, editor, viewer]

    Organization:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrgMembership:
      type: object
      required: [organization, role]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        role:
          $ref: "#/components/schemas/Role"

    Me:
      type: object
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrgMembership"

    OrganizationCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    Member:
      type: object
      description: A user's membership in the current organization.
      required: [user_id, email, role, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time

    MemberRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked]

    Invitation:
      type: object
      description: A pending (or resolved) invitation to join the organization.
      required: [id, email, role, status, expires_at, created_at, accept_url]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        accept_url:
          type: string
          description: The copy-able invite link an admin can share.

    InvitationCreateRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        role:
          $ref: "#/components/schemas/Role"

    InvitationCreateResult:
      type: object
      required: [invitation, email_sent]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        email_sent:
          type: boolean
          description: |
            Whether an invitation email was enqueued. False when email isn't
            configured (or enqueueing failed) — share the accept_url manually.

    InvitationPreview:
      type: object
      description: What an invitation token is for, for the accept screen.
      required: [organization_name, role, status, expired]
      properties:
        organization_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expired:
          type: boolean
          description: Whether the invitation is past its expiry (only meaningful when pending).

    ConnectionMethod:
      type: string
      description: |
        How Spacefleet connects to the cluster.
          - in_cluster: Spacefleet runs in this cluster; use its service account.
          - kubeconfig: a supplied kubeconfig with embedded static credentials.
          - token: explicit API URL + CA + ServiceAccount bearer token.
          - eks/gke/aks: cloud-native auth (credentials minted at connect time).
      enum: [in_cluster, kubeconfig, token, eks, gke, aks]

    ClusterStatus:
      type: string
      description: Result of the most recent connectivity probe.
      enum: [pending, connected, error]

    Cluster:
      type: object
      required:
        [id, name, connection_method, status, config, runs_jobs, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        connection_method:
          $ref: "#/components/schemas/ConnectionMethod"
        endpoint:
          type: string
          description: API server URL (display); may be empty or discovered.
        status:
          $ref: "#/components/schemas/ClusterStatus"
        status_message:
          type: string
          description: Human-readable detail when status is error.
        k8s_version:
          type: string
          description: Server version reported by the last successful probe.
        runs_jobs:
          type: boolean
          description: |
            Whether this cluster is designated to run jobs (Tekton job running
            is enabled). See /api/clusters/{id}/tekton for the full status.
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        config:
          type: object
          description: Non-secret per-method parameters (region, project, …).
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NodeResources:
      type: object
      description: A node's compute resources, as reported by Kubernetes.
      required: [cpu, memory, pods]
      properties:
        cpu:
          type: string
          description: CPU quantity (e.g. "4" or "3920m").
        memory:
          type: string
          description: Memory quantity (e.g. "16331752Ki").
        pods:
          type: string
          description: Maximum number of pods.

    NodeTaint:
      type: object
      required: [key, effect]
      properties:
        key:
          type: string
        value:
          type: string
        effect:
          type: string
          description: NoSchedule, PreferNoSchedule, or NoExecute.

    NodeCondition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
          description: e.g. Ready, MemoryPressure, DiskPressure.
        status:
          type: string
          description: "True, False, or Unknown."
        reason:
          type: string
        message:
          type: string
        last_transition_time:
          type: string
          format: date-time
          nullable: true

    Node:
      type: object
      description: A single Kubernetes node, as seen live on the cluster.
      required:
        [name, ready, unschedulable, roles, labels, taints, conditions, created_at]
      properties:
        name:
          type: string
        ready:
          type: boolean
          description: Whether the node's Ready condition is True.
        unschedulable:
          type: boolean
          description: Whether the node is cordoned (spec.unschedulable).
        roles:
          type: array
          description: Roles derived from node-role.kubernetes.io/* labels.
          items:
            type: string
        kubelet_version:
          type: string
        os_image:
          type: string
        kernel_version:
          type: string
        container_runtime:
          type: string
        architecture:
          type: string
        operating_system:
          type: string
        internal_ip:
          type: string
        external_ip:
          type: string
        hostname:
          type: string
        pod_cidr:
          type: string
        provider_id:
          type: string
        instance_type:
          type: string
          description: From the node.kubernetes.io/instance-type label.
        zone:
          type: string
          description: From the topology.kubernetes.io/zone label.
        region:
          type: string
          description: From the topology.kubernetes.io/region label.
        capacity:
          $ref: "#/components/schemas/NodeResources"
        allocatable:
          $ref: "#/components/schemas/NodeResources"
        labels:
          type: object
          additionalProperties:
            type: string
        taints:
          type: array
          items:
            $ref: "#/components/schemas/NodeTaint"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/NodeCondition"
        created_at:
          type: string
          format: date-time

    Namespace:
      type: object
      description: A single Kubernetes namespace, as seen live on the cluster.
      required: [name, status, labels, created_at]
      properties:
        name:
          type: string
        status:
          type: string
          description: The namespace phase (Active, or Terminating while deleting).
        labels:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time

    HelmRelease:
      type: object
      description: |
        A Helm release discovered on a cluster (the newest revision), decoded
        from its release Secret. The discovery step behind importing an existing
        release as an application; values is what `helm get values` would show.
      required: [name, namespace, chart_name, chart_version, status, revision]
      properties:
        name:
          type: string
        namespace:
          type: string
        chart_name:
          type: string
        chart_version:
          type: string
        app_version:
          type: string
        status:
          type: string
          description: The release status (e.g. deployed, failed, pending-upgrade).
        revision:
          type: integer
          description: The release revision number (the newest one discovered).
        values:
          type: string
          description: |
            The release's user-supplied values rendered as YAML (the overrides
            passed at install/upgrade, not the chart defaults). May be empty.
        updated_at:
          type: string
          format: date-time
          description: When the discovered revision was last deployed.

    PodCondition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
          description: e.g. Ready, Initialized, ContainersReady, PodScheduled.
        status:
          type: string
          description: "True, False, or Unknown."
        reason:
          type: string
        message:
          type: string
        last_transition_time:
          type: string
          format: date-time
          nullable: true

    ContainerStatus:
      type: object
      description: The live state of a single container in a pod.
      required: [name, ready, restart_count]
      properties:
        name:
          type: string
        image:
          type: string
        ready:
          type: boolean
        started:
          type: boolean
        restart_count:
          type: integer
        state:
          type: string
          description: Running, Waiting, or Terminated.
        state_reason:
          type: string
          description: For waiting/terminated containers (e.g. CrashLoopBackOff).
        state_message:
          type: string

    Pod:
      type: object
      description: A single Kubernetes pod, as seen live on the cluster.
      required:
        [
          name,
          namespace,
          phase,
          status,
          ready,
          ready_containers,
          total_containers,
          restarts,
          labels,
          conditions,
          containers,
          created_at,
        ]
      properties:
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
          description: Pending, Running, Succeeded, Failed, or Unknown.
        status:
          type: string
          description: |
            The display status kubectl shows, which folds container state into
            the phase (e.g. Running, CrashLoopBackOff, Completed, Terminating).
        ready:
          type: string
          description: Ready/total container count (e.g. "2/3").
        ready_containers:
          type: integer
        total_containers:
          type: integer
        restarts:
          type: integer
          description: Total container restarts across the pod.
        node_name:
          type: string
        pod_ip:
          type: string
        host_ip:
          type: string
        qos_class:
          type: string
          description: Guaranteed, Burstable, or BestEffort.
        service_account:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/PodCondition"
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerStatus"
        created_at:
          type: string
          format: date-time

    ClusterIdentity:
      type: object
      description: |
        The identity the cluster's stored credentials resolve to, as reported by
        the Kubernetes API (a SelfSubjectReview). On older API servers this may be
        unavailable, in which case the fields are empty.
      required: [groups]
      properties:
        username:
          type: string
          description: |
            The authenticated user, e.g. "system:serviceaccount:spacefleet:reader".
        uid:
          type: string
        groups:
          type: array
          items:
            type: string

    CapabilityRule:
      type: object
      description: One RBAC permission the credentials were missing for a capability.
      required: [resource, verb]
      properties:
        api_group:
          type: string
          description: The resource's API group; absent for the core group.
        resource:
          type: string
        subresource:
          type: string
        verb:
          type: string
        reason:
          type: string
          description: The authorizer's explanation for the denial, if any.

    Capability:
      type: object
      description: |
        One product capability and whether the cluster's credentials are allowed
        it. Denied capabilities carry the missing rules that explain why.
      required: [key, area, title, status, missing_rules]
      properties:
        key:
          type: string
          description: Stable identifier, e.g. "view_nodes".
        area:
          type: string
          description: Grouping the capability belongs to, e.g. "Observe".
        title:
          type: string
          description: Human-readable label, e.g. "View nodes".
        status:
          type: string
          enum: [allowed, denied]
        missing_rules:
          type: array
          description: The RBAC rules/verbs that were denied (empty when allowed).
          items:
            $ref: "#/components/schemas/CapabilityRule"

    ClusterCapabilities:
      type: object
      description: |
        A live report of which product capabilities the cluster's stored
        credentials are allowed and the identity they resolve to. To grant a
        selection of capabilities, generate a manifest via the capabilities/rbac
        endpoint.
      required: [identity, capabilities]
      properties:
        identity:
          $ref: "#/components/schemas/ClusterIdentity"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"

    ClusterRbacRequest:
      type: object
      description: The capabilities to grant in the generated manifest.
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          description: |
            Capability keys to include (e.g. ["view_pods", "restart_workloads"]).
            Each must be a known capability; the manifest grants the union of the
            selected capabilities' full rule sets.
          items:
            type: string

    ClusterRbac:
      type: object
      description: A generated RBAC manifest (or best-effort guidance) for selected capabilities.
      required: [manifest]
      properties:
        manifest:
          type: string
          description: |
            For connection methods with an addressable in-cluster subject
            (in_cluster, token), a ready-to-apply ClusterRole + ClusterRoleBinding
            granting the selected capabilities' full rule set to the resolved
            subject. For other methods (kubeconfig, eks, gke, aks), best-effort
            guidance rather than a directly applicable manifest.

    TektonInstallStatus:
      type: string
      description: |
        The Tekton install lifecycle for a cluster.
          - not_installed: Tekton is absent (or was uninstalled).
          - installing: a background job is installing Tekton.
          - installed: Tekton is present and the controller is ready.
          - upgrading: re-applying a newer pinned release.
          - failed: the last install/upgrade job errored (see status_message).
          - uninstalling: a background job is removing Tekton.
      enum:
        [
          not_installed,
          installing,
          installed,
          upgrading,
          failed,
          uninstalling,
        ]

    TektonStatus:
      type: object
      description: |
        Whether a cluster is designated to run jobs (enabled) and the Tekton
        install lifecycle (status), reconciled with a live presence detection
        (present/controller_ready/detected_version). present and controller_ready
        reflect the most recent detection; enable/disable responses carry the
        stored state only, until the next status read or stream tick.
      required: [enabled, status, present, controller_ready, managed, pinned_version]
      properties:
        enabled:
          type: boolean
          description: Whether this cluster is designated to run jobs.
        status:
          $ref: "#/components/schemas/TektonInstallStatus"
        status_message:
          type: string
          description: The last install-progress line, or the error when failed.
        installed_version:
          type: string
          description: The pinned Tekton version applied by the last install.
        job_id:
          type: string
          description: Id of the in-flight install/uninstall job, for correlation.
        present:
          type: boolean
          description: Whether the Tekton API group is registered in the cluster.
        controller_ready:
          type: boolean
          description: Whether the Tekton controller has a ready replica.
        managed:
          type: boolean
          description: |
            Whether Tekton in this cluster was installed by Spacefleet. Upgrade
            and delete are only offered when true — a Tekton installed outside
            Spacefleet is never modified or removed.
        detected_version:
          type: string
          description: The running controller's reported version, if detected.
        pinned_version:
          type: string
          description: The Tekton version Spacefleet installs (the upgrade target).
        last_checked_at:
          type: string
          format: date-time
          nullable: true

    TektonRunRequest:
      type: object
      description: A minimal single-step job to run as a Tekton TaskRun.
      required: [name, image, script]
      properties:
        name:
          type: string
          description: A name prefix for the run (a unique suffix is added).
        image:
          type: string
          description: The container image the step runs in.
        script:
          type: string
          description: The shell script the step executes.

    TektonRun:
      type: object
      description: A Tekton TaskRun's status.
      required: [name, namespace, phase]
      properties:
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
          description: Derived from the run's Succeeded condition.
          enum: [Pending, Running, Succeeded, Failed]
        pod_name:
          type: string
          description: The backing pod, once scheduled (stream logs from it).
        message:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    ClusterCreateRequest:
      type: object
      required: [name, connection_method]
      description: |
        A flat object: only the fields relevant to the chosen connection_method
        need be set; the server validates per method. Secret fields (kubeconfig,
        token, cloud credentials) are encrypted at rest and never returned.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        connection_method:
          $ref: "#/components/schemas/ConnectionMethod"
        # token method
        endpoint:
          type: string
          description: API server URL (token method).
        ca:
          type: string
          description: PEM-encoded CA certificate bundle (token method).
        insecure_skip_tls:
          type: boolean
          description: Disable TLS verification (token method; use sparingly).
        token:
          type: string
          description: ServiceAccount bearer token (token method).
        # kubeconfig method
        kubeconfig:
          type: string
          description: Full kubeconfig YAML with embedded static credentials.
        # eks method
        aws_region:
          type: string
        eks_cluster_name:
          type: string
        aws_access_key_id:
          type: string
        aws_secret_access_key:
          type: string
        aws_session_token:
          type: string
        aws_role_arn:
          type: string
          description: Optional role to assume after authenticating.
        # gke method
        gcp_project:
          type: string
        gcp_location:
          type: string
        gke_cluster_name:
          type: string
        gcp_service_account_key:
          type: string
          description: GCP service-account JSON key.
        # aks method
        azure_subscription_id:
          type: string
        azure_resource_group:
          type: string
        aks_cluster_name:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_client_secret:
          type: string

    ClusterUpdateRequest:
      type: object
      description: |
        All fields optional. Set name to rename; supply any credential field to
        re-encrypt and re-probe. The connection method is fixed at registration.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        endpoint:
          type: string
        ca:
          type: string
        insecure_skip_tls:
          type: boolean
        token:
          type: string
        kubeconfig:
          type: string
        aws_region:
          type: string
        eks_cluster_name:
          type: string
        aws_access_key_id:
          type: string
        aws_secret_access_key:
          type: string
        aws_session_token:
          type: string
        aws_role_arn:
          type: string
        gcp_project:
          type: string
        gcp_location:
          type: string
        gke_cluster_name:
          type: string
        gcp_service_account_key:
          type: string
        azure_subscription_id:
          type: string
        azure_resource_group:
          type: string
        aks_cluster_name:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_client_secret:
          type: string

    Application:
      type: object
      description: |
        A deployable workload that owns a deploy workflow (a DAG of components).
        The application holds only the workflow-owner fields; all chart-specific
        config and targeting (cluster + namespace) live on its components, and
        run/sync state lives on its runs.
      required:
        [
          id,
          name,
          runner_cluster_id,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        runner_cluster_id:
          type: string
          format: uuid
          description: The Tekton-enabled cluster the management jobs run on.
        imported:
          type: boolean
          description: |
            True when the application was adopted from a release already running
            on the cluster (the import flow) rather than created from scratch.
        group_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The application group (folder) this application belongs to, or null
            when it sits at the org root (ungrouped).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationCreateRequest:
      type: object
      required: [name, runner_cluster_id]
      description: |
        Register an application (the workflow owner). The deploy steps — and
        their per-component targeting — are added afterwards as components via
        the workflow builder; create only sets the name and the runner cluster.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        runner_cluster_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          description: |
            Optional application group (folder) to create the application in. Omit
            to create it at the org root (ungrouped).

    ApplicationImportRequest:
      type: object
      required: [name, runner_cluster_id]
      description: |
        Adopt an existing workload as an application. Creates the application in
        the imported state (the workflow owner only); the user then builds the
        deploy workflow from components. Same shape as ApplicationCreateRequest.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        runner_cluster_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          description: |
            Optional application group (folder) to adopt the application into.
            Omit to adopt it at the org root (ungrouped).

    ApplicationUpdateRequest:
      type: object
      description: |
        All fields optional. The name can change; the deploy steps and their
        targeting live on the components (edit them via the workflow builder).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    ApplicationGroup:
      type: object
      description: |
        A top-level folder for organizing an organization's applications. An
        application belongs to at most one group; groups do not nest.
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationGroupCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    ApplicationGroupUpdateRequest:
      type: object
      description: All fields optional. Only the name is mutable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    ApplicationGroupAssignment:
      type: object
      description: |
        Sets an application's group membership. group_id is always present: a
        uuid moves the application into that group, null removes it from any
        group (back to the org root).
      required: [group_id]
      properties:
        group_id:
          type: string
          format: uuid
          nullable: true

    ChartSource:
      type: string
      description: |
        Where a Helm component's chart comes from (a value of the component's
        `config.chart_source`).
          - http_repo: an HTTP Helm repository (repo_url + chart [+ version]).
          - oci: an OCI registry reference (repo_url [+ version]).
          - git: a chart in a Git repo (repo_url [+ git_ref] [+ git_path]).
      enum: [http_repo, oci, git]

    ChartCredential:
      type: object
      description: |
        A named credential set for pulling private Helm charts ("Private
        Charts"). A basic-auth username/password pair that works for both HTTP
        Helm repositories and OCI registries. The password is sealed at rest and
        never returned.
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
          description: Registry/repo username (non-secret).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChartCredentialCreateRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        username:
          type: string
        password:
          type: string
          minLength: 1

    ChartCredentialUpdateRequest:
      type: object
      description: |
        All fields optional. Supplying a password rotates it; an empty password
        is rejected.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        username:
          type: string
        password:
          type: string
          minLength: 1

    CloudProvider:
      type: string
      description: The cloud the credential authenticates to.
      enum: [aws, gcp, azure]

    CloudCredential:
      type: object
      description: |
        A named cloud-provider credential set (AWS, GCP, or Azure) for
        authenticating to a cloud — the foundation for cluster registration,
        private packages in workflows, etc. config holds non-secret identifiers
        safe to display; the secret material is sealed at rest and never
        returned.
      required: [id, name, provider, config, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          $ref: "#/components/schemas/CloudProvider"
        description:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          description: Non-secret per-provider identifiers (region, project, tenant/subscription id, …).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CloudCredentialCreateRequest:
      type: object
      required: [name, provider]
      description: |
        A flat object: only the fields relevant to the chosen provider need be
        set; the server validates per provider. Secret fields (access keys,
        service-account key, client secret) are encrypted at rest and never
        returned.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        provider:
          $ref: "#/components/schemas/CloudProvider"
        description:
          type: string
        # aws provider
        aws_access_key_id:
          type: string
        aws_secret_access_key:
          type: string
        aws_session_token:
          type: string
          description: Optional temporary-session token.
        aws_region:
          type: string
          description: Optional default region (non-secret).
        aws_role_arn:
          type: string
          description: Optional role to assume after authenticating (non-secret).
        # gcp provider
        gcp_service_account_key:
          type: string
          description: GCP service-account JSON key.
        gcp_project:
          type: string
          description: Optional project id (non-secret).
        # azure provider
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_client_secret:
          type: string
        azure_subscription_id:
          type: string
          description: Optional subscription id (non-secret).

    CloudCredentialUpdateRequest:
      type: object
      description: |
        All fields optional. Set name/description to edit metadata; supply any
        credential field to re-encrypt the secret. The provider is fixed at
        registration.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        aws_access_key_id:
          type: string
        aws_secret_access_key:
          type: string
        aws_session_token:
          type: string
        aws_region:
          type: string
        aws_role_arn:
          type: string
        gcp_service_account_key:
          type: string
        gcp_project:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_client_secret:
          type: string
        azure_subscription_id:
          type: string

    GitHubInstallation:
      type: object
      description: |
        An organization's installation of the operator's GitHub App, used to
        pull charts from private Git repositories. No secret is stored — the
        access token is minted on demand at rollout time.
      required: [id, installation_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        installation_id:
          type: integer
          format: int64
          description: The numeric GitHub App installation id.
        account_login:
          type: string
          description: The GitHub account (org or user) the App is installed on.
        account_type:
          type: string
          description: The account type, e.g. "Organization" or "User".
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GitHubInstallationCreateRequest:
      type: object
      required: [installation_id, state]
      properties:
        installation_id:
          type: integer
          format: int64
          description: The installation id GitHub returned to the connect callback.
        state:
          type: string
          description: |
            The signed state token issued by connect-url and round-tripped
            through GitHub's redirect; binds the installation to this org.

    GitHubConnectUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The GitHub App install URL to redirect the browser to.

    GitHubRepository:
      type: object
      description: |
        A repository reachable through one of the organization's GitHub App
        installations, tagged with the installation it came from so selecting it
        can fill the clone URL and select the matching installation at once.
      required: [installation_id, full_name, clone_url, private]
      properties:
        installation_id:
          type: string
          format: uuid
          description: |
            The Spacefleet installation record id (the value a component stores
            in github_installation_id), not GitHub's numeric installation id.
        account_login:
          type: string
          description: The GitHub account (org or user) the installation is on.
        full_name:
          type: string
          description: The repository's owner/name.
        clone_url:
          type: string
          description: The HTTPS clone URL.
        default_branch:
          type: string
          description: The repository's default branch.
        private:
          type: boolean
          description: Whether the repository is private.

    ComponentType:
      type: string
      description: The kind of step a workflow component runs.
      enum: [helm, manifest, terraform]

    Component:
      type: object
      description: |
        One node of an application's deploy workflow (a DAG step). Edges are
        expressed by each node's depends_on. The secret-bearing config (the Helm
        `values` override) is redacted for callers below editor.
      required: [id, name, type, config, depends_on, continue_on_failure]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ComponentType"
        config:
          type: object
          additionalProperties:
            type: string
          description: |
            Type-specific, non-secret parameters (helm: chart_source/repo_url/
            chart/version/git_ref/git_path/values/…; manifest: repo_url/git_ref/
            path; terraform: repo_url/git_ref/path/backend/backend_config/
            backend_mode/cloud_credential_id). An OpenTofu component is a single
            node: it runs `plan` then, once approved (see requires_approval),
            `apply` — the run expands it into those two steps, so `command` is
            not authored. `backend_mode` is `managed` (default — Spacefleet
            generates the state backend override) or `byo` (use the module's own
            backend block; `backend_config` entries are passed as `tofu init
            -backend-config` flags). `cloud_credential_id` is the UUID of an AWS
            cloud credential used to authenticate a `byo` backend run.
            `init_flags`/`plan_flags`/`apply_flags` are optional JSON arrays of
            extra CLI flag tokens appended to `tofu init`/`plan`/`apply` (one whole
            argument per element, e.g. `["-var=env=prod","-target=aws_instance.web"]`);
            since `apply` applies the plan step's saved plan, plan-time flags
            (`-var`/`-var-file`/`-target`) go in `plan_flags`, not `apply_flags`.
            The `values` and `backend_config` keys are redacted for callers below
            editor.
        depends_on:
          type: array
          items:
            type: string
            format: uuid
          description: Ids of sibling components this node waits on.
        continue_on_failure:
          type: boolean
          description: |
            When true, a failure of this node does not skip its dependents or
            fail the run (the run settles "partial" instead).
        requires_approval:
          type: boolean
          description: |
            When true, the run parks at this node (status awaiting_approval)
            until a human approves it; the node only runs once approved. Used to
            gate destructive or sensitive steps (e.g. an OpenTofu apply).
        target_cluster_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The cluster this component deploys into. Required for helm and
            manifest components; null for terraform (which has no cluster
            target).
        target_namespace:
          type: string
          description: |
            The namespace this component deploys into. Required for helm;
            unused for manifest (manifests carry their own namespaces) and
            terraform.
        chart_credential_id:
          type: string
          format: uuid
          nullable: true
          description: Optional credential for pulling a private chart.
        github_installation_id:
          type: string
          format: uuid
          nullable: true
          description: Optional GitHub App installation for a private git source.
        position:
          type: object
          additionalProperties:
            type: number
          description: Canvas coordinates {x, y} for the workflow builder UI.
        group_id:
          type: string
          format: uuid
          nullable: true
          description: |
            Id of the explicit group container this component is a parallel
            member of, or null when ungrouped. A node that depends on a group
            waits for all of its members.

    ComponentInput:
      type: object
      description: |
        One proposed workflow node, supplied by the canvas. id is client-provided
        (a stable uuid per node) so depends_on edges and canvas identity survive a
        replace.
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ComponentType"
        config:
          type: object
          additionalProperties:
            type: string
        depends_on:
          type: array
          items:
            type: string
            format: uuid
        continue_on_failure:
          type: boolean
        requires_approval:
          type: boolean
          description: |
            When true, the run parks at this node until a human approves it
            (status awaiting_approval). Defaults to false.
        target_cluster_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The cluster this component deploys into. Required for helm and
            manifest; must be null for terraform.
        target_namespace:
          type: string
          description: |
            The namespace this component deploys into. Required for helm;
            unused for manifest and terraform.
        chart_credential_id:
          type: string
          format: uuid
          nullable: true
        github_installation_id:
          type: string
          format: uuid
          nullable: true
        position:
          type: object
          additionalProperties:
            type: number
        group_id:
          type: string
          format: uuid
          nullable: true

    ComponentGroup:
      type: object
      description: |
        An explicit group container in an application's deploy workflow — a named
        box holding components that run in parallel. A node that depends on the
        group waits for all of its members (all-must-complete); a group's
        depends_on makes every member wait on those refs. Groups are a builder
        concept that desugar into component-level depends_on; the scheduler never
        sees a group.
      required: [id, name, depends_on]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        depends_on:
          type: array
          items:
            type: string
            format: uuid
          description: |
            Ids of the components/groups the whole group waits on (entries may
            reference a component or a sibling group).
        position:
          type: object
          additionalProperties:
            type: number
          description: Canvas coordinates {x, y} for the workflow builder UI.
        size:
          type: object
          additionalProperties:
            type: number
          description: Canvas dimensions {w, h} for the workflow builder UI.

    ComponentGroupInput:
      type: object
      description: |
        One proposed group container, supplied by the canvas. id is
        client-provided (a stable uuid per group) so component group_id refs and
        depends_on edges survive a replace.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        depends_on:
          type: array
          items:
            type: string
            format: uuid
        position:
          type: object
          additionalProperties:
            type: number
        size:
          type: object
          additionalProperties:
            type: number

    Workflow:
      type: object
      description: |
        An application's deploy workflow — its components plus any explicit group
        containers.
      required: [components, groups]
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/Component"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ComponentGroup"

    WorkflowReplaceRequest:
      type: object
      description: |
        The full set of components and group containers to replace the workflow
        with.
      required: [components]
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentInput"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ComponentGroupInput"

    RunAction:
      type: string
      description: What a workflow run does across the whole DAG.
      enum: [deploy, uninstall, preview]

    RunStatus:
      type: string
      description: |
        The run's lifecycle: pending → running → a terminal succeeded / failed /
        partial (partial = only continue-on-failure nodes failed). A run parked
        at a manual-approval gate is awaiting_approval (a non-terminal pause)
        until an approve/reject decision resumes it.
      enum: [pending, running, succeeded, failed, partial, awaiting_approval]

    RunStartRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/RunAction"
        force:
          type: boolean
          description: |
            Force a workload roll on a deploy: run the Helm step as a forced
            `helm upgrade --install --force` so pods churn even when the rendered
            manifests are unchanged. Only meaningful for the deploy action; the
            planner ignores it for uninstall and preview. Defaults to false.

    WorkflowRun:
      type: object
      description: One logical run of an application's deploy workflow.
      required: [id, application_id, action, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/RunAction"
        status:
          $ref: "#/components/schemas/RunStatus"
        message:
          type: string
          description: Human-readable detail (a progress line, or the summary).
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the run started executing; absent while pending.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the run settled; absent until terminal.

    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRun"

    ComponentRunStatus:
      type: string
      description: |
        A step's lifecycle: pending → running → a terminal succeeded / failed /
        skipped. A gated step parks at awaiting_approval (a non-terminal pause)
        until a human approves it, then moves back to pending and runs.
      enum: [pending, running, succeeded, failed, skipped, awaiting_approval]

    ComponentRun:
      type: object
      description: The execution of one workflow node within a run.
      required: [id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        component_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The source component, denormalized; null if it was deleted after the
            run.
        name:
          type: string
          description: The component's name as it ran (a snapshot).
        type:
          type: string
          description: The component's type as it ran (a snapshot).
        status:
          $ref: "#/components/schemas/ComponentRunStatus"
        message:
          type: string
          description: Human-readable detail (the last progress line, or the error).
        run_name:
          type: string
          description: The TaskRun name on the runner cluster for this step.
        requires_approval:
          type: boolean
          description: |
            Whether this step is gated on manual approval (a snapshot of the
            component's requires_approval at run start).
        approved_by:
          type: string
          description: |
            Email/identity of the user who approved or rejected the gate; empty
            until a decision is made.
        approved_at:
          type: string
          format: date-time
          nullable: true
          description: When the approval/rejection decision was made; absent until then.
        chart_revision:
          type: string
          description: Git commit SHA the chart was resolved to (git sources only).
        values_revision:
          type: string
          description: Git commit SHAs the values sources were resolved to.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the step started executing; absent while pending.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the step settled; absent until terminal.

    ComponentRunDetail:
      allOf:
        - $ref: "#/components/schemas/ComponentRun"
        - type: object
          properties:
            logs:
              type: string
              description: |
                The captured output, persisted when the step settled. Empty while
                still in flight (follow it live via the log stream).
            diff:
              type: string
              description: |
                For a preview (dry-run) run, the parsed diff body — what deploying
                this component would change on the live cluster. Empty for
                non-preview runs (and while a preview is still in flight).
            has_changes:
              type: boolean
              description: |
                For a preview (dry-run) run, whether deploying this component would
                change the live cluster. False for non-preview runs.

    WorkflowRunDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowRun"
        - type: object
          required: [component_runs]
          properties:
            component_runs:
              type: array
              items:
                $ref: "#/components/schemas/ComponentRun"
            graph:
              type: string
              description: |
                JSON snapshot of the workflow graph (nodes + edges + config) as it
                was when the run began. Secret-bearing config is redacted for
                callers below editor.

    Variable:
      type: object
      description: |
        A named key/value passed to component jobs as an environment variable,
        defined at the group level (every application in the group), the app
        level (every component), or the component level. Lower levels are
        overridden by higher: group < app < component for a same-named variable.
        A sensitive variable's value is sealed at rest and never returned — only
        its name and the sensitive flag are.
      required: [id, name, sensitive, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The environment variable name (a shell-safe identifier).
        sensitive:
          type: boolean
          description: |
            When true, the value is sealed at rest and never returned (write-only,
            it can only be replaced).
        value:
          type: string
          description: |
            The plaintext value. Present only for non-sensitive variables; a
            sensitive variable's value is never returned.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VariableCreateRequest:
      type: object
      required: [name, sensitive, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: A shell-safe identifier, unique within the variable's scope.
        sensitive:
          type: boolean
          description: |
            When true, the value is sealed at rest and never returned. Fixed at
            creation (delete and recreate to change).
        value:
          type: string
          description: |
            The value. Required (a sensitive variable's must be non-empty); for a
            non-sensitive variable an empty string is allowed.

    VariableUpdateRequest:
      type: object
      description: |
        All fields optional. Omit `value` to leave it unchanged — the only way to
        keep a sensitive value, which is never returned. The sensitive flag is
        fixed at creation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: string

  parameters:
    OrganizationID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    ClusterID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    ApplicationID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    ApplicationGroupID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    ChartCredentialID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    CloudCredentialID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    GitHubInstallationID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    RunID:
      in: path
      name: runId
      required: true
      schema:
        type: string
        format: uuid

    ComponentRunID:
      in: path
      name: componentRunId
      required: true
      schema:
        type: string
        format: uuid

    ComponentID:
      in: path
      name: componentId
      required: true
      schema:
        type: string
        format: uuid

    VariableID:
      in: path
      name: variableId
      required: true
      schema:
        type: string
        format: uuid

    MemberUserID:
      in: path
      name: userId
      required: true
      schema:
        type: string
        format: uuid

    InvitationID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    InviteToken:
      in: path
      name: token
      required: true
      schema:
        type: string

  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
