        - $ref: "#/components/parameters/VariableID"
      responses:
        "204":
          description: Variable deleted
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/workflow:
    get:
      summary: Get an application's deploy workflow (its stages and components)
      description: |
        Org-scoped. Returns the application's workflow as its ordered stages,
        each holding its ordered components. Stages run in order; the
        components within a stage run in parallel. Secret-bearing component
        config (the Helm `values` override) is redacted for callers below
        editor.
      operationId: getApplicationWorkflow
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The application's workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        default:
          $ref: "#/components/responses/Error"
    put:
      summary: Replace an application's deploy workflow
      description: |
        Org-scoped, editor or above. Validates the proposed workflow (distinct
        non-zero ids, non-empty stage names, per-type config valid,
        output references only to OpenTofu components in an earlier stage) and
        atomically replaces the application's stages and components with it,
        keeping the order given. A validation failure returns 400 before any
        write. Moving an OpenTofu component whose recorded state still lists
        resources to a different state backend returns 409 (code
        `backend_change`) unless `allow_backend_change` is set: the new
        backend starts empty, so the next run would plan to create
        everything again.
      operationId: replaceApplicationWorkflow
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowReplaceRequest"
      responses:
        "200":
          description: The replaced workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/component-outputs:
    get:
      summary: Known output keys per component (for reference autocomplete)
      description: |
        Org-scoped, editor or above. Returns, per component, the names of the
        OpenTofu (Terraform) outputs captured by that component's latest
        successful run — keys only, never the values — so the workflow editor
        can autocomplete `${{ components.<name>.outputs.<key> }}` references.
        Components that have not yet produced outputs are omitted (the editor
        still offers the component name and lets the author type a key).
      operationId: getApplicationComponentOutputs
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: Per-component known output keys, keyed by component id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentOutputKeys"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/components/{componentId}/state:
    get:
      summary: An OpenTofu component's last recorded state (outputs + resources)
      description: |
        Org-scoped. Returns what the component's most recent successful apply
        recorded: its output values and the inventory of resources it manages,
        with the run that recorded them. This is the component's persistent
        "what do I own" view — the same data a run's apply step carries, found
        without opening run history. Sensitive output values are omitted for
        callers below editor. 404 when the component has never applied
        successfully (or is not an OpenTofu component).
      operationId: getComponentState
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
      responses:
        "200":
          description: The component's last recorded outputs and resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentState"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/components/{componentId}/runs:
    post:
      summary: Start a run limited to one OpenTofu component (destroy, or targeted deploy)
      description: |
        Org-scoped, editor or above. Starts a `deploy` or `uninstall` run
        that covers only this OpenTofu component, optionally narrowed to a
        fixed list of resource addresses (`targets`, rendered as `-target`
        flags on the plan). `uninstall` is a per-component **destroy**: the
        plan is a destroy plan and the apply is **always** parked for
        approval, whatever the component's own setting, so the resources
        about to go are reviewed first. `deploy` plans and applies just this
        module (a targeted apply when `targets` is given) and keeps the
        component's own approval gate. The run's `scope` names the component
        and targets. Requires the background worker (503 otherwise). 400 for
        another action, an invalid target address, or a component that is
        not an OpenTofu component; 409 while a run is already in flight for
        the application.
      operationId: startComponentRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScopedRunRequest"
      responses:
        "202":
          description: Run accepted; the job is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/components/{componentId}/state-ops:
    post:
      summary: Start a guarded state operation on an OpenTofu component
      description: |
        Org-scoped, editor or above. Starts a `state_op` run for one OpenTofu
        component: `force_unlock` (release a stuck state lock), `rm` (stop
        managing a resource without destroying it), `mv` (rename a resource
        in state), or `import` (adopt existing infrastructure into state).
        Each is a fixed operation with typed fields — never a free-form
        command line. The run is a single step that is **always** parked at
        an approval gate first: the run detail shows the exact command that
        will run (`state_op.command`), and an editor or above approves or
        rejects it like any gated step. After the operation the component's
        recorded state (outputs + resources) is refreshed. Requires the
        background worker (503 otherwise). 400 for an invalid operation or a
        component that is not an OpenTofu component; 409 while a run is
        already in flight for the application.
      operationId: startStateOperation
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StateOperationRequest"
      responses:
        "202":
          description: Run accepted; it parks at its approval gate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/variables:
    get:
      summary: List an application's app-level variables
      description: |
        Org-scoped. App-level variables are passed to every component job of the
        application as environment variables. A sensitive variable's value is
        sealed and never returned (only `sensitive: true` and the name).
      operationId: listApplicationVariables
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The application's app-level variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add an app-level variable
      description: |
        Org-scoped, editor or above. A sensitive variable's value is sealed at
        rest and never returned (requires an encryption key,
        SPACEFLEET_SECRET_KEY). Names are a shell-safe identifier and unique
        among the application's app-level variables.
      operationId: createApplicationVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableCreateRequest"
      responses:
        "201":
          description: Variable created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/variables/{variableId}:
    patch:
      summary: Update an app-level variable
      description: |
        Org-scoped, editor or above. Renames and/or replaces the value. Omit
        `value` to leave it unchanged (the only way to keep a sensitive value,
        which is never returned). The sensitive flag is fixed at creation.
      operationId: updateApplicationVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/VariableID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableUpdateRequest"
      responses:
        "200":
          description: Variable updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an app-level variable
      operationId: deleteApplicationVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/VariableID"
      responses:
        "204":
          description: Variable deleted
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/components/{componentId}/variables:
    get:
      summary: List a component's variables
      description: |
        Org-scoped. Component-level variables are passed to that one component's
        job and override an app-level variable of the same name. A sensitive
        variable's value is sealed and never returned.
      operationId: listComponentVariables
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
      responses:
        "200":
          description: The component's variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a component-level variable
      description: |
        Org-scoped, editor or above. Overrides an app-level variable of the same
        name for this component. A sensitive variable's value is sealed at rest
        and never returned. The component must already exist (save the workflow
        first). Names are unique among the component's variables.
      operationId: createComponentVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableCreateRequest"
      responses:
        "201":
          description: Variable created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/components/{componentId}/variables/{variableId}:
    patch:
      summary: Update a component-level variable
      description: |
        Org-scoped, editor or above. Renames and/or replaces the value. Omit
        `value` to leave it unchanged. The sensitive flag is fixed at creation.
      operationId: updateComponentVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
        - $ref: "#/components/parameters/VariableID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariableUpdateRequest"
      responses:
        "200":
          description: Variable updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Variable"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a component-level variable
      operationId: deleteComponentVariable
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/ComponentID"
        - $ref: "#/components/parameters/VariableID"
      responses:
        "204":
          description: Variable deleted
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs:
    get:
      summary: List an application's workflow runs
      description: |
        Org-scoped. Returns the application's workflow runs newest-first — one
        per deploy/uninstall/preview of the whole workflow, plus component-scoped
        runs and state operations — for a CI-like history.
        Component runs and the graph snapshot are not included here; fetch a
        single run for those.
      operationId: listRuns
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The application's workflow runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Start a workflow run (deploy, uninstall, preview, or drift)
      description: |
        Org-scoped, editor or above. A `state_op` cannot be started here (400;
        use the component's state-ops endpoint). Snapshots the current workflow graph,
        creates a run plus one component run per node, and enqueues the
        background job that executes it. Returns immediately (202); follow
        progress via the run stream. Requires the background worker (503
        otherwise). Returns 409 while a run is already in flight for the app.
      operationId: startRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunStartRequest"
      responses:
        "202":
          description: Run accepted; the job is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}/cancel:
    post:
      summary: Cancel an in-flight workflow run
      description: |
        Org-scoped, editor or above. Marks an in-flight (pending or running) run
        failed and settles its non-terminal component runs, clearing the
        application's in-flight gate so a new run can start. Returns 409 if the
        run is already terminal (nothing to cancel). The background executor's
        own retries short-circuit on the now-terminal rows, so cancellation is a
        durable stop, not just a UI affordance.
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The cancelled run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}:
    get:
      summary: Get one workflow run, with its component runs and graph snapshot
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The workflow run, its component runs, and the graph snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunDetail"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}/components/{componentRunId}:
    get:
      summary: Get one component run within a workflow run, with its logs
      description: |
        The captured `logs` are written when the step settles. While a step is
        still running, editors can follow its output live at
        /api/applications/{id}/runs/{runId}/components/{componentRunId}/logs/stream
        (Server-Sent Events: a `log` event per line, then `eof` when the
        container exits; 404 until the step's pod is scheduled, 403 below
        editor).
      operationId: getComponentRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/ComponentRunID"
      responses:
        "200":
          description: The component run, including its captured logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentRunDetail"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}/components/{componentRunId}/approve:
    post:
      summary: Approve a workflow run's manual-approval gate
      description: |
        Org-scoped, editor or above. Approves a step parked at awaiting_approval
        so the run resumes and the gated node runs. Returns 409 if the step is
        not awaiting approval (nothing to decide) and 503 if the background
        worker is not configured. The approver's identity is recorded on the
        component run.
      operationId: approveComponentRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/ComponentRunID"
      responses:
        "200":
          description: The run, resuming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/runs/{runId}/components/{componentRunId}/reject:
    post:
      summary: Reject a workflow run's manual-approval gate
      description: |
        Org-scoped, editor or above. Rejects a step parked at awaiting_approval:
        the step settles failed and the run resumes to settle (its dependents
        skip). Returns 409 if the step is not awaiting approval and 503 if the
        background worker is not configured. The rejector's identity is recorded
        on the component run.
      operationId: rejectComponentRun
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
        - $ref: "#/components/parameters/RunID"
        - $ref: "#/components/parameters/ComponentRunID"
      responses:
        "200":
          description: The run, resuming
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRun"
        default:
          $ref: "#/components/responses/Error"

  /api/chart-credentials:
    get:
      summary: List the chart credentials in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Credentials for pulling private Helm charts ("Private Charts"). The
        password is never returned.
      operationId: listChartCredentials
      responses:
        "200":
          description: Chart credentials in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartCredential"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register a chart credential in the current organization
      description: |
        Org-scoped, editor or above. The password is sealed at rest and never
        returned. Requires an encryption key (SPACEFLEET_SECRET_KEY).
      operationId: createChartCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartCredentialCreateRequest"
      responses:
        "201":
          description: Chart credential registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCredential"
        default:
          $ref: "#/components/responses/Error"

  /api/chart-credentials/{id}:
    get:
      summary: Get a chart credential
      operationId: getChartCredential
      parameters:
        - $ref: "#/components/parameters/ChartCredentialID"
      responses:
        "200":
          description: The chart credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCredential"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a chart credential
      description: |
        Org-scoped, editor or above. Updates the name, username, and/or
        password. The type is fixed at registration.
      operationId: updateChartCredential
      parameters:
        - $ref: "#/components/parameters/ChartCredentialID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartCredentialUpdateRequest"
      responses:
        "200":
          description: Chart credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCredential"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a chart credential
      description: |
        Org-scoped, editor or above. A credential still attached to an
        application cannot be deleted (409).
      operationId: deleteChartCredential
      parameters:
        - $ref: "#/components/parameters/ChartCredentialID"
      responses:
        "204":
          description: Chart credential deleted
        default:
          $ref: "#/components/responses/Error"

  /api/policies:
    get:
      summary: List the plan policies in the current organization
      description: |
        Org-scoped. Rego policies evaluated against every OpenTofu plan of
        the applications they cover, before the apply.
      operationId: listPolicies
      responses:
        "200":
          description: The organization's policies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a plan policy
      description: |
        Org-scoped, admin only. The Rego must compile and declare
        `package spacefleet` (400 otherwise, with the compiler's message).
        Names are unique within the organization.
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyCreateRequest"
      responses:
        "201":
          description: The created policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Error"

  /api/policies/plans:
    get:
      summary: Recent OpenTofu plan steps to dry-run a policy against
      description: |
        Org-scoped, admin only. The organization's most recent succeeded
        OpenTofu plan steps (deploy, uninstall, and preview runs), newest
        first, each with its application, component, and plan counts — the
        picker for `POST /api/policies/test`.
      operationId: listPolicyTestPlans
      responses:
        "200":
          description: Recent plan steps, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicyTestPlan"
        default:
          $ref: "#/components/responses/Error"

  /api/policies/test:
    post:
      summary: Evaluate a policy against a past plan without saving it
      description: |
        Org-scoped, admin only. Evaluates the given Rego — as typed, saved or
        not — against one of the organization's past OpenTofu plan steps,
        exactly as the gate would have, and returns the messages it would
        have produced plus the input document it saw. Nothing is stored and
        no run is affected. 400 when the Rego does not compile (with the
        compiler's message); 404 when the step is not one of the
        organization's succeeded plan steps.
      operationId: testPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyTestRequest"
      responses:
        "200":
          description: What the policy would have said
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyTestResult"
        default:
          $ref: "#/components/responses/Error"

  /api/policies/{id}:
    get:
      summary: Get a plan policy
      operationId: getPolicy
      parameters:
        - $ref: "#/components/parameters/PolicyID"
      responses:
        "200":
          description: The policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a plan policy
      description: Org-scoped, admin only.
      operationId: updatePolicy
      parameters:
        - $ref: "#/components/parameters/PolicyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyUpdateRequest"
      responses:
        "200":
          description: The updated policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a plan policy
      description: Org-scoped, admin only.
      operationId: deletePolicy
      parameters:
        - $ref: "#/components/parameters/PolicyID"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/notification-channels:
    get:
      summary: List the notification channels in the current organization
      description: |
        Org-scoped. Where run notifications go — an email address, a Slack
        incoming webhook, or a generic webhook — with the events each
        receives. A webhook's URL is sealed at rest and never returned; only
        its host is shown.
      operationId: listNotificationChannels
      responses:
        "200":
          description: The organization's notification channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannel"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Add a notification channel
      description: |
        Org-scoped, admin only. A webhook kind needs the encryption key
        (SPACEFLEET_SECRET_KEY) to seal its URL. Names are unique within the
        organization.
      operationId: createNotificationChannel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelCreateRequest"
      responses:
        "201":
          description: The created channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        default:
          $ref: "#/components/responses/Error"

  /api/notification-channels/{id}:
    patch:
      summary: Update a notification channel
      description: Org-scoped, admin only. The kind is fixed at creation.
      operationId: updateNotificationChannel
      parameters:
        - $ref: "#/components/parameters/NotificationChannelID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelUpdateRequest"
      responses:
        "200":
          description: The updated channel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a notification channel
      description: Org-scoped, admin only.
      operationId: deleteNotificationChannel
      parameters:
        - $ref: "#/components/parameters/NotificationChannelID"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Error"

  /api/notification-channels/{id}/test:
    post:
      summary: Send a test notification to a channel
      description: |
        Org-scoped, admin only. Enqueues a synthetic test message to the
        channel so its destination can be confirmed. Requires the background
        worker (503 otherwise).
      operationId: testNotificationChannel
      parameters:
        - $ref: "#/components/parameters/NotificationChannelID"
      responses:
        "202":
          description: Test notification accepted for delivery
        default:
          $ref: "#/components/responses/Error"

  /api/cloud-credentials:
    get:
      summary: List the cloud credentials in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Cloud-provider credentials (AWS, GCP, Azure) used to authenticate to a
        cloud. The sealed secret material is never returned.
      operationId: listCloudCredentials
      responses:
        "200":
          description: Cloud credentials in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CloudCredential"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register a cloud credential in the current organization
      description: |
        Org-scoped, editor or above. The secret material is sealed at rest and
        never returned. Requires an encryption key (SPACEFLEET_SECRET_KEY). An
        organization may register many credentials, including several of the
        same provider; names are unique within the organization.
      operationId: createCloudCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudCredentialCreateRequest"
      responses:
        "201":
          description: Cloud credential registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCredential"
        default:
          $ref: "#/components/responses/Error"

  /api/cloud-credentials/{id}:
    get:
      summary: Get a cloud credential
      operationId: getCloudCredential
      parameters:
        - $ref: "#/components/parameters/CloudCredentialID"
      responses:
        "200":
          description: The cloud credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCredential"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a cloud credential
      description: |
        Org-scoped, editor or above. Updates the name, description, and/or the
        credential material. Supplying any credential field re-encrypts the
        secret. The provider is fixed at registration.
      operationId: updateCloudCredential
      parameters:
        - $ref: "#/components/parameters/CloudCredentialID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloudCredentialUpdateRequest"
      responses:
        "200":
          description: Cloud credential updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CloudCredential"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a cloud credential
      operationId: deleteCloudCredential
      parameters:
        - $ref: "#/components/parameters/CloudCredentialID"
      responses:
        "204":
          description: Cloud credential deleted
        default:
          $ref: "#/components/responses/Error"

  /api/github/installations:
    get:
      summary: List the GitHub App installations in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Installations of the operator's GitHub App, used to pull charts from
        private Git repositories.
      operationId: listGitHubInstallations
      responses:
        "200":
          description: GitHub installations in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Record a GitHub App installation from the connect callback
      description: |
        Org-scoped, editor or above. Called by the SPA after GitHub redirects
        back from the install flow. The state token (issued by connect-url) is
        verified to bind the installation to the initiating organization, and
        the OAuth authorization code is exchanged to confirm the user who
        completed the install has access to the installation, before it is
        recorded.
      operationId: createGitHubInstallation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GitHubInstallationCreateRequest"
      responses:
        "201":
          description: Installation recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallation"
        default:
          $ref: "#/components/responses/Error"

  /api/github/repositories:
    get:
      summary: List repositories reachable across the organization's GitHub installations
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Aggregates the repositories every one of the organization's GitHub App
        installations can reach, each tagged with the installation it came from,
        so the workflow editor can offer a single quick-pick list. An
        installation that can't be read is skipped rather than failing the list.
      operationId: listGitHubRepositories
      responses:
        "200":
          description: Repositories across the organization's installations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GitHubRepository"
        default:
          $ref: "#/components/responses/Error"

  /api/github/installations/connect-url:
    get:
      summary: Get the GitHub App install URL to begin connecting
      description: |
        Org-scoped, editor or above. Returns the URL to redirect the browser to
        so the user can install the operator's GitHub App. It carries a signed,
        short-lived state token binding the flow to the current organization,
        which the create endpoint verifies on the callback.
      operationId: getGitHubConnectUrl
      responses:
        "200":
          description: The install URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnectUrl"
        default:
          $ref: "#/components/responses/Error"

  /api/github/installations/{id}:
    delete:
      summary: Delete a GitHub App installation
      description: |
        Org-scoped, editor or above. An installation still attached to an
        application cannot be deleted (409). This removes the record from
        Spacefleet only; it does not uninstall the App on GitHub.
      operationId: deleteGitHubInstallation
      parameters:
        - $ref: "#/components/parameters/GitHubInstallationID"
      responses:
        "204":
          description: Installation deleted
        default:
          $ref: "#/components/responses/Error"

components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    User:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string

    Role:
      type: string
      description: |
        A member's role within an organization (hierarchical: admin > editor >
        viewer). admin manages the organization itself (members, invitations,
        renaming); editor can take any action within the app but not manage the
        org; viewer is read-only.
      enum: [admin, editor, viewer]

    Organization:
      type: object
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    OrgMembership:
      type: object
      required: [organization, role]
      properties:
        organization:
          $ref: "#/components/schemas/Organization"
        role:
          $ref: "#/components/schemas/Role"

    Me:
      type: object
      required: [user, organizations]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organizations:
          type: array
          items:
            $ref: "#/components/schemas/OrgMembership"

    OrganizationCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    Member:
      type: object
      description: A user's membership in the current organization.
      required: [user_id, email, role, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        created_at:
          type: string
          format: date-time

    MemberRoleUpdateRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked]

    Invitation:
      type: object
      description: A pending (or resolved) invitation to join the organization.
      required: [id, email, role, status, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    InvitationCreateRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 320
        role:
          $ref: "#/components/schemas/Role"

    InvitationCreateResult:
      type: object
      required: [invitation, accept_url, email_sent]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        accept_url:
          type: string
          description: |
            The copy-able invite link an admin can share. Only the token's hash
            is stored, so this is the only time the link is available — listing
            invitations does not return it (re-inviting the same address issues
            a fresh link and supersedes this one).
        email_sent:
          type: boolean
          description: |
            Whether an invitation email was enqueued. False when email isn't
            configured (or enqueueing failed) — share the accept_url manually.

    InvitationPreview:
      type: object
      description: What an invitation token is for, for the accept screen.
      required: [organization_name, role, status, expired]
      properties:
        organization_name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/InvitationStatus"
        expired:
          type: boolean
          description: Whether the invitation is past its expiry (only meaningful when pending).

    ConnectionMethod:
      type: string
      description: |
        How Spacefleet connects to the cluster.
          - in_cluster: Spacefleet runs in this cluster; use its service account.
          - kubeconfig: a supplied kubeconfig with embedded static credentials.
          - token: explicit API URL + CA + ServiceAccount bearer token.
          - eks/gke/aks: cloud-native auth (credentials minted at connect time).
      enum: [in_cluster, kubeconfig, token, eks, gke, aks]

    ClusterStatus:
      type: string
      description: Result of the most recent connectivity probe.
      enum: [pending, connected, error]

    Cluster:
      type: object
      required:
        [id, name, connection_method, status, config, runs_jobs, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        connection_method:
          $ref: "#/components/schemas/ConnectionMethod"
        endpoint:
          type: string
          description: API server URL (display); may be empty or discovered.
        status:
          $ref: "#/components/schemas/ClusterStatus"
        status_message:
          type: string
          description: Human-readable detail when status is error.
        k8s_version:
          type: string
          description: Server version reported by the last successful probe.
        runs_jobs:
          type: boolean
          description: |
            Whether this cluster is designated to run jobs (Tekton job running
            is enabled). See /api/clusters/{id}/tekton for the full status.
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        config:
          type: object
          description: Non-secret per-method parameters (region, project, …).
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NodeResources:
      type: object
      description: A node's compute resources, as reported by Kubernetes.
      required: [cpu, memory, pods]
      properties:
        cpu:
          type: string
          description: CPU quantity (e.g. "4" or "3920m").
        memory:
          type: string
          description: Memory quantity (e.g. "16331752Ki").
        pods:
          type: string
          description: Maximum number of pods.

    NodeTaint:
      type: object
      required: [key, effect]
      properties:
        key:
          type: string
        value:
          type: string
        effect:
          type: string
          description: NoSchedule, PreferNoSchedule, or NoExecute.

    NodeCondition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
          description: e.g. Ready, MemoryPressure, DiskPressure.
        status:
          type: string
          description: "True, False, or Unknown."
        reason:
          type: string
        message:
          type: string
        last_transition_time:
          type: string
          format: date-time
          nullable: true

    Node:
      type: object
      description: A single Kubernetes node, as seen live on the cluster.
      required:
        [name, ready, unschedulable, roles, labels, taints, conditions, created_at]
      properties:
        name:
          type: string
        ready:
          type: boolean
          description: Whether the node's Ready condition is True.
        unschedulable:
          type: boolean
          description: Whether the node is cordoned (spec.unschedulable).
        roles:
          type: array
          description: Roles derived from node-role.kubernetes.io/* labels.
          items:
            type: string
        kubelet_version:
          type: string
        os_image:
          type: string
        kernel_version:
          type: string
        container_runtime:
          type: string
        architecture:
          type: string
        operating_system:
          type: string
        internal_ip:
          type: string
        external_ip:
          type: string
        hostname:
          type: string
        pod_cidr:
          type: string
        provider_id:
          type: string
        instance_type:
          type: string
          description: From the node.kubernetes.io/instance-type label.
        zone:
          type: string
          description: From the topology.kubernetes.io/zone label.
        region:
          type: string
          description: From the topology.kubernetes.io/region label.
        capacity:
          $ref: "#/components/schemas/NodeResources"
        allocatable:
          $ref: "#/components/schemas/NodeResources"
        labels:
          type: object
          additionalProperties:
            type: string
        taints:
          type: array
          items:
            $ref: "#/components/schemas/NodeTaint"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/NodeCondition"
        created_at:
          type: string
          format: date-time

    Namespace:
      type: object
      description: A single Kubernetes namespace, as seen live on the cluster.
      required: [name, status, labels, created_at]
      properties:
        name:
          type: string
        status:
          type: string
          description: The namespace phase (Active, or Terminating while deleting).
        labels:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time

    HelmRelease:
      type: object
      description: |
        A Helm release discovered on a cluster (the newest revision), decoded
        from its release Secret. The discovery step behind importing an existing
        release as an application; values is what `helm get values` would show.
      required: [name, namespace, chart_name, chart_version, status, revision]
      properties:
        name:
          type: string
        namespace:
          type: string
        chart_name:
          type: string
        chart_version:
          type: string
        app_version:
          type: string
        status:
          type: string
          description: The release status (e.g. deployed, failed, pending-upgrade).
        revision:
          type: integer
          description: The release revision number (the newest one discovered).
        values:
          type: string
          description: |
            The release's user-supplied values rendered as YAML (the overrides
            passed at install/upgrade, not the chart defaults). May be empty.
        updated_at:
          type: string
          format: date-time
          description: When the discovered revision was last deployed.

    PodCondition:
      type: object
      required: [type, status]
      properties:
        type:
          type: string
          description: e.g. Ready, Initialized, ContainersReady, PodScheduled.
        status:
          type: string
          description: "True, False, or Unknown."
        reason:
          type: string
        message:
          type: string
        last_transition_time:
          type: string
          format: date-time
          nullable: true

    ContainerStatus:
      type: object
      description: The live state of a single container in a pod.
      required: [name, ready, restart_count]
      properties:
        name:
          type: string
        image:
          type: string
        ready:
          type: boolean
        started:
          type: boolean
        restart_count:
          type: integer
        state:
          type: string
          description: Running, Waiting, or Terminated.
        state_reason:
          type: string
          description: For waiting/terminated containers (e.g. CrashLoopBackOff).
        state_message:
          type: string

    Pod:
      type: object
      description: A single Kubernetes pod, as seen live on the cluster.
      required:
        [
          name,
          namespace,
          phase,
          status,
          ready,
          ready_containers,
          total_containers,
          restarts,
          labels,
          conditions,
          containers,
          created_at,
        ]
      properties:
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
          description: Pending, Running, Succeeded, Failed, or Unknown.
        status:
          type: string
          description: |
            The display status kubectl shows, which folds container state into
            the phase (e.g. Running, CrashLoopBackOff, Completed, Terminating).
        ready:
          type: string
          description: Ready/total container count (e.g. "2/3").
        ready_containers:
          type: integer
        total_containers:
          type: integer
        restarts:
          type: integer
          description: Total container restarts across the pod.
        node_name:
          type: string
        pod_ip:
          type: string
        host_ip:
          type: string
        qos_class:
          type: string
          description: Guaranteed, Burstable, or BestEffort.
        service_account:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/PodCondition"
        containers:
          type: array
          items:
            $ref: "#/components/schemas/ContainerStatus"
        created_at:
          type: string
          format: date-time

    ClusterIdentity:
      type: object
      description: |
        The identity the cluster's stored credentials resolve to, as reported by
        the Kubernetes API (a SelfSubjectReview). On older API servers this may be
        unavailable, in which case the fields are empty.
      required: [groups]
      properties:
        username:
          type: string
          description: |
            The authenticated user, e.g. "system:serviceaccount:spacefleet:reader".
        uid:
          type: string
        groups:
          type: array
          items:
            type: string

    CapabilityRule:
      type: object
      description: One RBAC permission the credentials were missing for a capability.
      required: [resource, verb]
      properties:
        api_group:
          type: string
          description: The resource's API group; absent for the core group.
        resource:
          type: string
        subresource:
          type: string
        verb:
          type: string
        reason:
          type: string
          description: The authorizer's explanation for the denial, if any.

    Capability:
      type: object
      description: |
        One product capability and whether the cluster's credentials are allowed
        it. Denied capabilities carry the missing rules that explain why.
      required: [key, area, title, status, missing_rules]
      properties:
        key:
          type: string
          description: Stable identifier, e.g. "view_nodes".
        area:
          type: string
          description: Grouping the capability belongs to, e.g. "Observe".
        title:
          type: string
          description: Human-readable label, e.g. "View nodes".
        status:
          type: string
          enum: [allowed, denied]
        missing_rules:
          type: array
          description: The RBAC rules/verbs that were denied (empty when allowed).
          items:
            $ref: "#/components/schemas/CapabilityRule"

    ClusterCapabilities:
      type: object
      description: |
        A live report of which product capabilities the cluster's stored
        credentials are allowed and the identity they resolve to. To grant a
        selection of capabilities, generate a manifest via the capabilities/rbac
        endpoint.
      required: [identity, capabilities]
      properties:
        identity:
          $ref: "#/components/schemas/ClusterIdentity"
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"

    ClusterRbacRequest:
      type: object
      description: The capabilities to grant in the generated manifest.
      required: [keys]
      properties:
        keys:
          type: array
          minItems: 1
          description: |
            Capability keys to include (e.g. ["view_pods", "restart_workloads"]).
            Each must be a known capability; the manifest grants the union of the
            selected capabilities' full rule sets.
          items:
            type: string

    ClusterRbac:
      type: object
      description: A generated RBAC manifest (or best-effort guidance) for selected capabilities.
      required: [manifest]
      properties:
        manifest:
          type: string
          description: |
            For connection methods with an addressable in-cluster subject
            (in_cluster, token), a ready-to-apply ClusterRole + ClusterRoleBinding
            granting the selected capabilities' full rule set to the resolved
            subject. For other methods (kubeconfig, eks, gke, aks), best-effort
            guidance rather than a directly applicable manifest.

    TektonInstallStatus:
      type: string
      description: |
        The Tekton install lifecycle for a cluster.
          - not_installed: Tekton is absent (or was uninstalled).
          - installing: a background job is installing Tekton.
          - installed: Tekton is present and the controller is ready.
          - upgrading: re-applying a newer pinned release.
          - failed: the last install/upgrade job errored (see status_message).
          - uninstalling: a background job is removing Tekton.
      enum:
        [
          not_installed,
          installing,
          installed,
          upgrading,
          failed,
          uninstalling,
        ]

    TektonPluginCache:
      type: object
      description: |
        The OpenTofu provider plugin cache on a runner cluster. Absent (or an
        empty size) means no cache.
      required: [size]
      properties:
        size:
          type: string
          description: Requested storage for the cache claim, a Kubernetes quantity (e.g. `20Gi`). Empty removes the cache.
        storage_class:
          type: string
          description: The StorageClass of the claim; empty uses the cluster default. Must support ReadWriteMany.

    TektonStatus:
      type: object
      description: |
        Whether a cluster is designated to run jobs (enabled) and the Tekton
        install lifecycle (status), reconciled with a live presence detection
        (present/controller_ready/detected_version). present and controller_ready
        reflect the most recent detection; enable/disable responses carry the
        stored state only, until the next status read or stream tick.
      required:
        [
          enabled,
          status,
          present,
          controller_ready,
          managed,
          pinned_version,
          expected_revision,
          update_available,
        ]
      properties:
        enabled:
          type: boolean
          description: Whether this cluster is designated to run jobs.
        status:
          $ref: "#/components/schemas/TektonInstallStatus"
        status_message:
          type: string
          description: The last install-progress line, or the error when failed.
        installed_version:
          type: string
          description: The pinned Tekton version applied by the last install.
        job_id:
          type: string
          description: Id of the in-flight install/uninstall job, for correlation.
        present:
          type: boolean
          description: Whether the Tekton API group is registered in the cluster.
        controller_ready:
          type: boolean
          description: Whether the Tekton controller has a ready replica.
        managed:
          type: boolean
          description: |
            Whether Tekton in this cluster was installed by Spacefleet. Upgrade
            and delete are only offered when true — a Tekton installed outside
            Spacefleet is never modified or removed.
        detected_version:
          type: string
          description: The running controller's reported version, if detected.
        pinned_version:
          type: string
          description: The Tekton version Spacefleet installs (the upgrade target).
        detected_revision:
          type: string
          description: |
            The install-manifest revision stamped on the running controller by
            the install that applied it, if detected. Absent for installs that
            predate revision stamping — those read as update_available.
        expected_revision:
          type: string
          description: |
            The revision of the install manifest set this Spacefleet would
            apply. When a managed install's detected_revision differs, the
            install is out of sync (even at the same Tekton version) and an
            upgrade re-applies the manifest to converge it.
        update_available:
          type: boolean
          description: |
            Whether the managed install differs from what this Spacefleet
            expects — a newer pinned Tekton version, or a changed install
            manifest set at the same version. Only ever true for a
            Spacefleet-managed install. Like present/controller_ready it
            reflects the most recent live detection; responses carrying stored
            state only report false.
        last_checked_at:
          type: string
          format: date-time
          nullable: true
        plugin_cache:
          $ref: "#/components/schemas/TektonPluginCache"

    TektonRunRequest:
      type: object
      description: A minimal single-step job to run as a Tekton TaskRun.
      required: [name, image, script]
      properties:
        name:
          type: string
          description: A name prefix for the run (a unique suffix is added).
        image:
          type: string
          description: The container image the step runs in.
        script:
          type: string
          description: The shell script the step executes.

    TektonRun:
      type: object
      description: A Tekton TaskRun's status.
      required: [name, namespace, phase]
      properties:
        name:
          type: string
        namespace:
          type: string
        phase:
          type: string
          description: Derived from the run's Succeeded condition.
          enum: [Pending, Running, Succeeded, Failed]
        pod_name:
          type: string
          description: The backing pod, once scheduled (stream logs from it).
        message:
          type: string
        started_at:
          type: string
          format: date-time
          nullable: true
        completed_at:
          type: string
          format: date-time
          nullable: true

    ClusterCreateRequest:
      type: object
      required: [name, connection_method]
      description: |
        A flat object: only the fields relevant to the chosen connection_method
        need be set; the server validates per method. Secret fields (kubeconfig,
        token, cloud credentials) are encrypted at rest and never returned.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        connection_method:
          $ref: "#/components/schemas/ConnectionMethod"
        # token method
        endpoint:
          type: string
          description: API server URL (token method).
        ca:
          type: string
          description: PEM-encoded CA certificate bundle (token method).
        insecure_skip_tls:
          type: boolean
          description: Disable TLS verification (token method; use sparingly).
        token:
          type: string
          description: ServiceAccount bearer token (token method).
        # kubeconfig method
        kubeconfig:
          type: string
          description: Full kubeconfig YAML with embedded static credentials.
        # eks method
        aws_region:
          type: string
        eks_cluster_name:
          type: string
        aws_access_key_id:
          type: string
        aws_secret_access_key:
          type: string
        aws_session_token:
          type: string
        aws_role_arn:
          type: string
          description: Optional role to assume after authenticating.
        # gke method
        gcp_project:
          type: string
        gcp_location:
          type: string
        gke_cluster_name:
          type: string
        gcp_service_account_key:
          type: string
          description: GCP service-account JSON key.
        # aks method
        azure_subscription_id:
          type: string
        azure_resource_group:
          type: string
        aks_cluster_name:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_client_secret:
          type: string

    ClusterUpdateRequest:
      type: object
      description: |
        All fields optional. Set name to rename; supply any credential field to
        re-encrypt and re-probe. The connection method is fixed at registration.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        endpoint:
          type: string
        ca:
          type: string
        insecure_skip_tls:
          type: boolean
        token:
          type: string
        kubeconfig:
          type: string
        aws_region:
          type: string
        eks_cluster_name:
          type: string
        aws_access_key_id:
          type: string
        aws_secret_access_key:
          type: string
        aws_session_token:
          type: string
        aws_role_arn:
          type: string
        gcp_project:
          type: string
        gcp_location:
          type: string
        gke_cluster_name:
          type: string
        gcp_service_account_key:
          type: string
        azure_subscription_id:
          type: string
        azure_resource_group:
          type: string
        aks_cluster_name:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_client_secret:
          type: string

    Application:
      type: object
      description: |
        A deployable workload that owns a deploy workflow (stages of components).
        The application holds only the workflow-owner fields; all chart-specific
        config and targeting (cluster + namespace) live on its components, and
        run/sync state lives on its runs.
      required:
        [
          id,
          name,
          runner_cluster_id,
          created_at,
          updated_at,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        runner_cluster_id:
          type: string
          format: uuid
          description: The Tekton-enabled cluster the management jobs run on.
        imported:
          type: boolean
          description: |
            True when the application was adopted from a release already running
            on the cluster (the import flow) rather than created from scratch.
        drift_interval_minutes:
          type: integer
          description: |
            How often, in minutes, a scheduled drift check runs on the
            application's OpenTofu components; 0 means never.
        push_trigger:
          $ref: "#/components/schemas/PushTrigger"
        pr_plans:
          type: boolean
          description: |
            Whether a pull request against a branch one of the application's
            components tracks starts a preview run at the pull request's
            head, reported back to GitHub as a check run.
        group_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The application group (folder) this application belongs to, or null
            when it sits at the org root (ungrouped).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationCreateRequest:
      type: object
      required: [name, runner_cluster_id]
      description: |
        Register an application (the workflow owner). The deploy steps — and
        their per-component targeting — are added afterwards as components via
        the workflow builder; create only sets the name and the runner cluster.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          description: |
            A slug: lowercase letters, digits, and hyphens, starting and ending
            with a letter or digit (e.g. "my-app"). The name seeds the default
            Helm release name for the app's components, so it must be safe to
            reuse as a DNS-1123 label.
        runner_cluster_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          description: |
            Optional application group (folder) to create the application in. Omit
            to create it at the org root (ungrouped).

    ApplicationImportRequest:
      type: object
      required: [name, runner_cluster_id]
      description: |
        Adopt an existing workload as an application. Creates the application in
        the imported state (the workflow owner only); the user then builds the
        deploy workflow from components. Same shape as ApplicationCreateRequest.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          description: |
            A slug: lowercase letters, digits, and hyphens, starting and ending
            with a letter or digit (e.g. "my-app"). The name seeds the default
            Helm release name for the app's components, so it must be safe to
            reuse as a DNS-1123 label.
        runner_cluster_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
          description: |
            Optional application group (folder) to adopt the application into.
            Omit to adopt it at the org root (ungrouped).

    ApplicationUpdateRequest:
      type: object
      description: |
        All fields optional. The name can change; the deploy steps and their
        targeting live on the components (edit them via the workflow builder).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          description: |
            A slug: lowercase letters, digits, and hyphens, starting and ending
            with a letter or digit (e.g. "my-app"). The name seeds the default
            Helm release name for the app's components, so it must be safe to
            reuse as a DNS-1123 label.
        drift_interval_minutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: |
            How often, in minutes, to run a scheduled drift check on the
            application's OpenTofu components: 0 turns the schedule off;
            otherwise between 15 and 10080 (weekly). A check is skipped while
            another run is in flight and retried on the next tick.
        push_trigger:
          $ref: "#/components/schemas/PushTrigger"
        pr_plans:
          type: boolean

    PushTrigger:
      type: string
      description: |
        What a GitHub push to a branch one of the application's components
        tracks starts: nothing (empty), a `preview`, or a `deploy`. Only
        components attached to a connected GitHub installation take part;
        a component tracks the branch named by its git ref, or the
        repository's default branch when it has none.
      enum: ["", preview, deploy]

    RunTrigger:
      type: object
      description: |
        How a run was started when it was not a person or the scheduler: the
        GitHub event, repository, branch, commit, and sender, and the pull
        request number for a pull-request preview. Absent on other runs.
      required: [source, event, repo, branch, sha]
      properties:
        source:
          type: string
          description: Always `github` today.
        event:
          type: string
          enum: [push, pull_request]
        repo:
          type: string
          description: The repository's full name, e.g. `acme/infra`.
        branch:
          type: string
          description: The pushed branch, or a pull request's head branch.
        sha:
          type: string
        sender:
          type: string
          description: The GitHub login that caused the event.
        pr_number:
          type: integer

    ApplicationGroup:
      type: object
      description: |
        A top-level folder for organizing an organization's applications. An
        application belongs to at most one group; groups do not nest.
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ApplicationGroupCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    ApplicationGroupUpdateRequest:
      type: object
      description: All fields optional. Only the name is mutable.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200

    ApplicationGroupAssignment:
      type: object
      description: |
        Sets an application's group membership. group_id is always present: a
        uuid moves the application into that group, null removes it from any
        group (back to the org root).
      required: [group_id]
      properties:
        group_id:
          type: string
          format: uuid
          nullable: true

    ChartSource:
      type: string
      description: |
        Where a Helm component's chart comes from (a value of the component's
        `config.chart_source`).
          - http_repo: an HTTP Helm repository (repo_url + chart [+ version]).
          - oci: an OCI registry reference (repo_url [+ version]).
          - git: a chart in a Git repo (repo_url [+ git_ref] [+ git_path]).
      enum: [http_repo, oci, git]

    ChartCredential:
      type: object
      description: |
        A named credential set for pulling private Helm charts ("Private
        Charts"). A basic-auth username/password pair that works for both HTTP
        Helm repositories and OCI registries. The password is sealed at rest and
        never returned.
      required: [id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
          description: Registry/repo username (non-secret).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChartCredentialCreateRequest:
      type: object
      required: [name, password]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        username:
          type: string
        password:
          type: string
          minLength: 1

    ChartCredentialUpdateRequest:
      type: object
      description: |
        All fields optional. Supplying a password rotates it; an empty password
        is rejected.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        username:
          type: string
        password:
          type: string
          minLength: 1

    CloudProvider:
      type: string
      description: The cloud the credential authenticates to.
      enum: [aws, gcp, azure]

    PolicyEnforcement:
      type: string
      description: |
        What a violation does: `block` fails the plan step so the apply
        never runs (the run fails); `warn` records it for the approver and
        lets the run proceed. A preview never fails on a policy — it records
        the verdict.
      enum: [block, warn]

    Policy:
      type: object
      required: [id, name, rego, enforcement, enabled, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        rego:
          type: string
          description: The Rego source (package spacefleet, a `deny` rule).
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
        enabled:
          type: boolean
        application_id:
          type: string
          format: uuid
          nullable: true
          description: The one application the policy is limited to, or null for every application.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PolicyCreateRequest:
      type: object
      required: [name, rego]
      properties:
        name:
          type: string
        description:
          type: string
        rego:
          type: string
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
        enabled:
          type: boolean
        application_id:
          type: string
          format: uuid
          nullable: true

    PolicyUpdateRequest:
      type: object
      description: All fields optional.
      properties:
        name:
          type: string
        description:
          type: string
        rego:
          type: string
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
        enabled:
          type: boolean
        application_id:
          type: string
          description: |
            Set to an application id to limit the policy to it, or to an
            empty string to cover every application. Omit to leave it as is.

    PolicyResult:
      type: object
      required: [policy_id, policy_name, enforcement, violations]
      properties:
        policy_id:
          type: string
        policy_name:
          type: string
        enforcement:
          $ref: "#/components/schemas/PolicyEnforcement"
        violations:
          type: array
          items:
            type: string
        error:
          type: string
          description: Set when the policy could not be evaluated; a block policy that errors blocks.

    PolicyVerdict:
      type: object
      description: |
        The policies evaluated against an OpenTofu plan step, recorded on the
        step. blocked means a block policy was violated (or could not be
        evaluated): on a deploy or uninstall the step failed and the apply
        was skipped. warned means a warn policy was violated.
      required: [evaluated_at, results, blocked, warned]
      properties:
        evaluated_at:
          type: string
          format: date-time
        results:
          type: array
          items:
            $ref: "#/components/schemas/PolicyResult"
        blocked:
          type: boolean
        warned:
          type: boolean

    PolicyTestPlan:
      type: object
      description: One past OpenTofu plan step a policy can be dry-run against.
      required: [component_run_id, run_id, application_id, application_name, component_name, action, add, change, destroy, replace]
      properties:
        component_run_id:
          type: string
          format: uuid
          description: The plan step — what `POST /api/policies/test` takes.
        run_id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        application_name:
          type: string
        component_name:
          type: string
        action:
          $ref: "#/components/schemas/RunAction"
        finished_at:
          type: string
          format: date-time
          nullable: true
        add:
          type: integer
        change:
          type: integer
        destroy:
          type: integer
        replace:
          type: integer

    PolicyTestRequest:
      type: object
      required: [rego, component_run_id]
      properties:
        rego:
          type: string
          description: The policy to evaluate (`package spacefleet`, a `deny` rule).
        component_run_id:
          type: string
          format: uuid
          description: The plan step to evaluate it against (from `GET /api/policies/plans`).

    PolicyTestResult:
      type: object
      description: |
        The dry run's outcome: the messages the policy's `deny` rule
        produced (none means the plan would pass), an evaluation error if
        the policy failed at runtime (a block policy would then block — fail
        closed), and the exact `input` document the policy saw.
      required: [violations, input]
      properties:
        violations:
          type: array
          items:
            type: string
        error:
          type: string
        input:
          type: object
          additionalProperties: true

    NotificationChannelKind:
      type: string
      description: |
        How a channel delivers: `email` (needs SMTP configured on the
        deployment), `slack` (a Slack incoming webhook URL), or `webhook`
        (any URL, receiving a JSON body with an `X-Spacefleet-Event` header
        and, when the channel has a signing secret, an
        `X-Spacefleet-Signature-256` HMAC of the body).
      enum: [email, slack, webhook]

    RunEventKind:
      type: string
      description: |
        The run events a channel can subscribe to: a run parked at an
        approval gate, a run that failed (including a timed-out approval or
        an abandoned run), or a drift check that found drift.
      enum: [awaiting_approval, run_failed, drift_detected]

    NotificationChannel:
      type: object
      required: [id, name, kind, address, events, has_secret, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/NotificationChannelKind"
        address:
          type: string
          description: |
            The destination as shown: the email address, or a webhook's
            host. A webhook's full URL is never returned.
        events:
          type: array
          items:
            $ref: "#/components/schemas/RunEventKind"
        has_secret:
          type: boolean
          description: |
            Whether a webhook channel signs its deliveries (a signing secret
            is set). The secret itself is never returned.
        application_id:
          type: string
          format: uuid
          nullable: true
          description: The one application the channel is limited to, or null for every application.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    NotificationChannelCreateRequest:
      type: object
      required: [name, kind, target, events]
      properties:
        name:
          type: string
        kind:
          $ref: "#/components/schemas/NotificationChannelKind"
        target:
          type: string
          description: The email address, or the webhook URL (sealed at rest).
        secret:
          type: string
          description: |
            Webhook kind only: a signing secret (sealed at rest). When set,
            every delivery carries `X-Spacefleet-Signature-256: sha256=<hex
            HMAC-SHA256 of the body>` for the receiver to verify.
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RunEventKind"
        application_id:
          type: string
          format: uuid
          nullable: true
          description: Limit the channel to one application; omit or null for every application.

    NotificationChannelUpdateRequest:
      type: object
      description: All fields optional; the kind cannot change.
      properties:
        name:
          type: string
        target:
          type: string
          description: A new email address or webhook URL.
        secret:
          type: string
          description: A new signing secret (webhook kind only), or an empty string to stop signing.
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RunEventKind"
        application_id:
          type: string
          description: |
            Set to an application id to limit the channel to it, or to an
            empty string to cover every application. Omit to leave it as is.

    CloudCredential:
      type: object
      description: |
        A named cloud-provider credential set (AWS, GCP, or Azure) for
        authenticating to a cloud — the foundation for cluster registration,
        private packages in workflows, etc. config holds non-secret identifiers
        safe to display; the secret material is sealed at rest and never
        returned.
      required: [id, name, provider, config, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        provider:
          $ref: "#/components/schemas/CloudProvider"
        description:
          type: string
        config:
          type: object
          additionalProperties:
            type: string
          description: Non-secret per-provider identifiers (region, project, tenant/subscription id, …).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CloudCredentialCreateRequest:
      type: object
      required: [name, provider]
      description: |
        A flat object: only the fields relevant to the chosen provider need be
        set; the server validates per provider. Secret fields (access keys,
        service-account key, client secret) are encrypted at rest and never
        returned.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        provider:
          $ref: "#/components/schemas/CloudProvider"
        description:
          type: string
        # aws provider
        aws_access_key_id:
          type: string
        aws_secret_access_key:
          type: string
        aws_session_token:
          type: string
          description: Optional temporary-session token.
        aws_region:
          type: string
          description: Optional default region (non-secret).
        aws_role_arn:
          type: string
          description: Optional role to assume after authenticating (non-secret).
        # gcp provider
        gcp_service_account_key:
          type: string
          description: GCP service-account JSON key.
        gcp_project:
          type: string
          description: Optional project id (non-secret).
        # azure provider
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_client_secret:
          type: string
        azure_subscription_id:
          type: string
          description: Optional subscription id (non-secret).

    CloudCredentialUpdateRequest:
      type: object
      description: |
        All fields optional. Set name/description to edit metadata; supply any
        credential field to re-encrypt the secret. The provider is fixed at
        registration.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        aws_access_key_id:
          type: string
        aws_secret_access_key:
          type: string
        aws_session_token:
          type: string
        aws_region:
          type: string
        aws_role_arn:
          type: string
        gcp_service_account_key:
          type: string
        gcp_project:
          type: string
        azure_tenant_id:
          type: string
        azure_client_id:
          type: string
        azure_client_secret:
          type: string
        azure_subscription_id:
          type: string

    GitHubInstallation:
      type: object
      description: |
        An organization's installation of the operator's GitHub App, used to
        pull charts from private Git repositories. No secret is stored — the
        access token is minted on demand at rollout time.
      required: [id, installation_id, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        installation_id:
          type: integer
          format: int64
          description: The numeric GitHub App installation id.
        account_login:
          type: string
          description: The GitHub account (org or user) the App is installed on.
        account_type:
          type: string
          description: The account type, e.g. "Organization" or "User".
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GitHubInstallationCreateRequest:
      type: object
      required: [installation_id, state, code]
      properties:
        installation_id:
          type: integer
          format: int64
          description: The installation id GitHub returned to the connect callback.
        state:
          type: string
          description: |
            The signed state token issued by connect-url and round-tripped
            through GitHub's redirect; binds the installation to this org.
        code:
          type: string
          description: |
            The OAuth authorization code GitHub appended to the callback
            redirect. Exchanged server-side for a user token to verify the
            user completing the install can actually access the claimed
            installation — without it an installation cannot be linked.

    GitHubConnectUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: The GitHub App install URL to redirect the browser to.

    GitHubRepository:
      type: object
      description: |
        A repository reachable through one of the organization's GitHub App
        installations, tagged with the installation it came from so selecting it
        can fill the clone URL and select the matching installation at once.
      required: [installation_id, full_name, clone_url, private]
      properties:
        installation_id:
          type: string
          format: uuid
          description: |
            The Spacefleet installation record id (the value a component stores
            in github_installation_id), not GitHub's numeric installation id.
        account_login:
          type: string
          description: The GitHub account (org or user) the installation is on.
        full_name:
          type: string
          description: The repository's owner/name.
        clone_url:
          type: string
          description: The HTTPS clone URL.
        default_branch:
          type: string
          description: The repository's default branch.
        private:
          type: boolean
          description: Whether the repository is private.

    ComponentType:
      type: string
      description: The kind of step a workflow component runs.
      enum: [helm, manifest, terraform]

    Component:
      type: object
      description: |
        One component of an application's deploy workflow: a typed step that
        runs within its stage, in parallel with the stage's other components.
        The secret-bearing config (the Helm `values` override) is redacted for
        callers below editor.
      required: [id, name, type, config, continue_on_failure]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: "#/components/schemas/ComponentType"
        config:
          type: object
          additionalProperties:
            type: string
          description: |
            Type-specific, non-secret parameters (helm: chart_source/repo_url/
            chart/version/git_ref/git_path/values/…; manifest: repo_url/git_ref/
            path; terraform: repo_url/git_ref/path/backend/backend_config/
            cloud_credential_id). An OpenTofu component is a single
            node: it runs `plan` then, once approved (see requires_approval),
            `apply` — the run expands it into those two steps, so `command` is
            not authored. `tofu_version` optionally selects the OpenTofu
            release line the component runs (e.g. `1.12`; empty runs the
            platform default line). The state backend is managed by Spacefleet
            (the run writes a backend override into the module, so state lands
            where this config says regardless of any backend block in code):
            `backend` must be `s3` (the only supported type today) and
            `backend_config` is a JSON object of its settings —
            `bucket`/`key`/`region` required; `dynamodb_table`, `encrypt`, and
            `kms_key_id` optional. State locking: on OpenTofu 1.10+ the run
            locks state natively in S3 automatically (no setup; set
            `use_lockfile` explicitly in `backend_config` only to override
            that, and only on 1.10+). On older lines, name a `dynamodb_table`
            — when a cloud credential is attached, Spacefleet creates the
            table if it doesn't exist.
            `cloud_credential_id` is the UUID of an AWS cloud credential the run
            signs in with (state backend + the module's AWS providers); empty
            uses the runner's own role.
            `auth_cluster_id` optionally attaches **cluster authentication**:
            the UUID of a registered cluster the run prepares ready-to-use
            Kubernetes authentication for. The run mounts a connection file for
            that cluster and points the standard `KUBE_CONFIG_PATH` environment
            variable at it, so Kubernetes-backed providers (kubernetes, helm,
            kubectl) in the module authenticate without any provider
            configuration in code. This is not a deploy target —
            `target_cluster_id` stays null for terraform.
            `init_flags`/`plan_flags`/`apply_flags` are optional JSON arrays of
            extra CLI flag tokens appended to `tofu init`/`plan`/`apply` (one whole
            argument per element, e.g. `["-var=env=prod","-target=aws_instance.web"]`);
            since `apply` applies the plan step's saved plan, plan-time flags
            (`-var`/`-var-file`/`-target`) go in `plan_flags`, not `apply_flags`.
            The `values` and `backend_config` keys are redacted for callers below
            editor.
        continue_on_failure:
          type: boolean
          description: |
            When true, a failure of this component does not skip the later
            stages or fail the run (the run settles "partial" instead).
        requires_approval:
          type: boolean
          description: |
            When true, the run parks at this node (status awaiting_approval)
            until a human approves it; the node only runs once approved. Used to
            gate destructive or sensitive steps (e.g. an OpenTofu apply).
        approval_policy:
          $ref: "#/components/schemas/ApprovalPolicy"
        target_cluster_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The cluster this component deploys into. Required for helm and
            manifest components; null for terraform (which has no cluster
            target).
        target_namespace:
          type: string
          description: |
            The namespace this component deploys into. Required for helm;
            unused for manifest (manifests carry their own namespaces) and
            terraform.
        chart_credential_id:
          type: string
          format: uuid
          nullable: true
          description: Optional credential for pulling a private chart.
        github_installation_id:
          type: string
          format: uuid
          nullable: true
          description: Optional GitHub App installation for a private git source.

    ApprovalPolicy:
      type: object
      description: |
        The policy applied at a component's approval gate (requires_approval).
        All fields optional; the empty policy is the default: any editor or
        admin may approve, one approval opens the gate, the person who started
        the run may approve, and a parked run waits indefinitely.
      properties:
        approvers:
          type: array
          items:
            type: string
          description: |
            Who may approve, by email. Empty means any editor or admin of the
            organization. Anyone with edit access may still reject.
        required:
          type: integer
          minimum: 0
          description: |
            How many distinct approvals open the gate (N-of-M). 0 and 1 both
            mean one. With named approvers, at most their number.
        require_different_approver:
          type: boolean
          description: |
            When true, the person who started the run cannot approve it
            (no self-approval).
        timeout_minutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: |
            Fail the run when the gate has waited this long without a
            decision. 0 waits indefinitely. Counted from the step parking (or
            its last partial approval).

    ComponentInput:
      type: object
      description: |
        One proposed workflow component, supplied by the builder. id is
        client-provided (a stable uuid per component) so the component's
        variables, state, and run history stay attached across a replace.
      required: [id, name, type]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          description: |
            A slug: lowercase letters, digits, and hyphens, starting and ending
            with a letter or digit (e.g. "web"). The component is referenced by
            this name in ${{ components.<name>.outputs.* }} expressions and it
            seeds the default Helm release name (<app>-<component>), so it must be
            safe to reuse as a DNS-1123 label.
        type:
          $ref: "#/components/schemas/ComponentType"
        config:
          type: object
          additionalProperties:
            type: string
        continue_on_failure:
          type: boolean
        requires_approval:
          type: boolean
          description: |
            When true, the run parks at this component until a human approves
            it (status awaiting_approval). Defaults to false.
        approval_policy:
          $ref: "#/components/schemas/ApprovalPolicy"
        target_cluster_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The cluster this component deploys into. Required for helm and
            manifest; must be null for terraform.
        target_namespace:
          type: string
          description: |
            The namespace this component deploys into. Required for helm;
            unused for manifest and terraform.
        chart_credential_id:
          type: string
          format: uuid
          nullable: true
        github_installation_id:
          type: string
          format: uuid
          nullable: true

    WorkflowStage:
      type: object
      description: |
        One stage of an application's workflow: a named, ordered set of
        components that run in parallel. Stages run in order — a stage starts
        once every component of the previous stage has finished, and a failure
        (without continue_on_failure) skips every later stage.
      required: [id, name, components]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/Component"

    WorkflowStageInput:
      type: object
      description: |
        One proposed stage, supplied by the builder. id is client-provided (a
        stable uuid per stage). A stage may be empty.
      required: [id, name, components]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: The stage's display name.
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentInput"

    Workflow:
      type: object
      description: |
        An application's deploy workflow — its stages, in run order, each with
        its components.
      required: [stages]
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStage"

    WorkflowReplaceRequest:
      type: object
      description: |
        The full workflow to replace the current one with: every stage, in run
        order, each with its components in display order.
      required: [stages]
      properties:
        stages:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStageInput"
        allow_backend_change:
          type: boolean
          description: |
            Confirms that OpenTofu components still managing resources may
            move to a different state backend, starting from empty state.
            Without it such a save is refused with 409 `backend_change`.

    RunAction:
      type: string
      description: |
        What a workflow run does across the whole workflow. `drift` is a drift
        check: every OpenTofu component runs a read-only refresh-only plan
        reporting what changed outside of OpenTofu since its last apply; Helm
        and Manifest components take no part (400 if the application has no
        OpenTofu component). `state_op` is a guarded state operation on one
        OpenTofu component (see the component's state-ops endpoint; it cannot
        be started through the run endpoint). A `deploy` or `uninstall` with
        a `scope` covers one OpenTofu component only (see the component's
        runs endpoint).
      enum: [deploy, uninstall, preview, drift, state_op]

    RunStatus:
      type: string
      description: |
        The run's lifecycle: pending → running → a terminal succeeded / failed /
        partial (partial = only continue-on-failure nodes failed). A run parked
        at a manual-approval gate is awaiting_approval (a non-terminal pause)
        until an approve/reject decision resumes it.
      enum: [pending, running, succeeded, failed, partial, awaiting_approval]

    RunStartRequest:
      type: object
      required: [action]
      properties:
        action:
          $ref: "#/components/schemas/RunAction"
        force:
          type: boolean
          description: |
            Force a workload roll on a deploy: run the Helm step as a forced
            `helm upgrade --install --force` so pods churn even when the rendered
            manifests are unchanged. Only meaningful for the deploy action; the
            planner ignores it for uninstall and preview. Defaults to false.

    WorkflowRun:
      type: object
      description: One logical run of an application's deploy workflow.
      required: [id, application_id, action, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        application_id:
          type: string
          format: uuid
        action:
          $ref: "#/components/schemas/RunAction"
        status:
          $ref: "#/components/schemas/RunStatus"
        message:
          type: string
          description: Human-readable detail (a progress line, or the summary).
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the run started executing; absent while pending.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the run settled; absent until terminal.
        started_by:
          type: string
          description: |
            Email of the user who started the run; empty for a run the
            scheduler started (a scheduled drift check).
        state_op:
          $ref: "#/components/schemas/StateOperation"
        scope:
          $ref: "#/components/schemas/RunScope"
        trigger:
          $ref: "#/components/schemas/RunTrigger"
        stages:
          type: array
          description: |
            The run's stages in order, each with its components and their
            combined status — the at-a-glance shape of the run. Present on the
            run list, the run detail, and their streams. A run started before
            workflows had stages gets stages derived from its recorded
            dependencies (named "Stage 1", "Stage 2", …).
          items:
            $ref: "#/components/schemas/RunStage"

    RunStage:
      type: object
      description: One stage of a run, with the combined status of its components.
      required: [name, status, components]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/ComponentRunStatus"
        components:
          type: array
          items:
            $ref: "#/components/schemas/RunStageComponent"

    RunStageComponent:
      type: object
      description: |
        One component within a run's stage. An OpenTofu component runs as two
        steps (plan, then apply — or just a plan on a read-only run), so it
        lists both step ids; every other component has one. status combines
        the steps: failed if any failed, then awaiting approval, then running,
        succeeded once every step succeeded.
      required: [component_id, name, type, status, component_run_ids]
      properties:
        component_id:
          type: string
          format: uuid
          description: The authored component's id (it may since have been deleted).
        name:
          type: string
          description: The component's name as it ran.
        type:
          type: string
          description: The component's type as it ran.
        status:
          $ref: "#/components/schemas/ComponentRunStatus"
        component_run_ids:
          type: array
          description: The ids of this component's steps (component runs), in run order.
          items:
            type: string
            format: uuid

    RunList:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowRun"

    ComponentRunStatus:
      type: string
      description: |
        A step's lifecycle: pending → running → a terminal succeeded / failed /
        skipped. A gated step parks at awaiting_approval (a non-terminal pause)
        until a human approves it, then moves back to pending and runs.
      enum: [pending, running, succeeded, failed, skipped, awaiting_approval]

    Approval:
      type: object
      required: [by, at]
      properties:
        by:
          type: string
          description: Email of the approver.
        at:
          type: string
          format: date-time

    ComponentRun:
      type: object
      description: The execution of one workflow node within a run.
      required: [id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        component_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The source component, denormalized; null if it was deleted after the
            run.
        name:
          type: string
          description: The component's name as it ran (a snapshot).
        type:
          type: string
          description: The component's type as it ran (a snapshot).
        status:
          $ref: "#/components/schemas/ComponentRunStatus"
        message:
          type: string
          description: Human-readable detail (the last progress line, or the error).
        run_name:
          type: string
          description: The TaskRun name on the runner cluster for this step.
        requires_approval:
          type: boolean
          description: |
            Whether this step is gated on manual approval (a snapshot of the
            component's requires_approval at run start).
        approved_by:
          type: string
          description: |
            Email/identity of the user who approved or rejected the gate; empty
            until a decision is made.
        approved_at:
          type: string
          format: date-time
          nullable: true
          description: When the approval/rejection decision was made; absent until then.
        approvals:
          type: array
          description: |
            Every approval recorded on this step's gate so far, in order — the
            N-of-M tally. Empty until someone approves.
          items:
            $ref: "#/components/schemas/Approval"
        policy:
          $ref: "#/components/schemas/PolicyVerdict"
        chart_revision:
          type: string
          description: Git commit SHA the chart was resolved to (git sources only).
        values_revision:
          type: string
          description: Git commit SHAs the values sources were resolved to.
        outputs:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentRunOutput"
          description: |
            Structured outputs captured from an OpenTofu (Terraform) apply step
            that succeeded on a deploy run — the module's output values, keyed
            by output name. Absent for every other step and until the apply
            settles. Sensitive output values are omitted for callers below
            editor.
        plan:
          $ref: "#/components/schemas/PlanSummary"
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
          description: When the step started executing; absent while pending.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the step settled; absent until terminal.

    PlanSummary:
      type: object
      description: |
        The structured summary of an OpenTofu (Terraform) plan step's result,
        parsed from its captured plan output once the step settles: the
        add/change/destroy totals and whether applying would change anything.
        Present only on a settled OpenTofu plan step (deploy, uninstall, or
        preview) whose output contained a plan. Contains no values, so it is
        not redacted.
      required: [has_changes, add, change, destroy, replace, resources]
      properties:
        has_changes:
          type: boolean
          description: Whether applying the plan would change infrastructure or outputs.
        add:
          type: integer
          description: Resources to add (tofu's own total; a replacement counts here and in destroy).
        change:
          type: integer
          description: Resources to change in place.
        destroy:
          type: integer
          description: Resources to destroy.
        replace:
          type: integer
          description: Resources to destroy and recreate (a subset of add/destroy).
        outputs_changed:
          type: boolean
          description: Whether the plan changes any output values.
        resources:
          type: array
          description: Every planned resource action, in plan order.
          items:
            $ref: "#/components/schemas/PlanResourceChange"
        refresh_only:
          type: boolean
          description: |
            Whether this was a refresh-only plan (a drift check): it proposes
            no configuration changes, so has_changes reflects drift alone.
        has_drift:
          type: boolean
          description: |
            Whether tofu found resources changed outside of OpenTofu since the
            last apply — reported by every plan, and the whole content of a
            drift check.
        drift:
          type: array
          description: |
            The drifted resources: each with action `drift_update` (changed
            outside of OpenTofu) or `drift_delete` (deleted outside of
            OpenTofu), and the state-vs-real diff on the detail for editors.
          items:
            $ref: "#/components/schemas/PlanResourceChange"

    PlanResourceChange:
      type: object
      description: One resource's planned action.
      required: [address, action]
      properties:
        address:
          type: string
          description: The resource address (e.g. module.vpc.aws_subnet.private[0]).
        action:
          type: string
          enum: [create, update, replace, delete, read, move, import, forget, other, drift_update, drift_delete]
          description: The coarse action; `detail` carries tofu's own phrasing.
        detail:
          type: string
          description: |
            Tofu's phrasing of the action from the plan ("must be replaced",
            "is tainted, so must be replaced", "has moved to …").
        diff:
          type: string
          description: |
            This resource's block of the plan text — its attribute-level
            +/~/- lines. Only on the component run detail, and only for
            callers at editor or above (it can echo configuration values).

    ComponentRunOutput:
      type: object
      description: One captured OpenTofu (Terraform) output value.
      required: [sensitive]
      properties:
        value:
          description: |
            The output's value — any JSON type, as the module produced it.
            Omitted when the output is sensitive and the caller is below
            editor.
          nullable: true
        sensitive:
          type: boolean
          description: |
            Whether the module marked this output sensitive. Sensitive values
            are masked in the UI and omitted entirely below editor.

    TofuResource:
      type: object
      description: |
        One resource an OpenTofu (Terraform) component manages, as recorded
        after its last successful apply — the identity fields of the state
        entry, never its attribute values.
      required: [address, mode, type, name]
      properties:
        address:
          type: string
          description: The module-qualified resource address (e.g. module.net.aws_vpc.main).
        mode:
          type: string
          description: "`managed` for a resource, `data` for a data source."
        type:
          type: string
          description: The resource type (e.g. aws_vpc).
        name:
          type: string
          description: The resource's local name within its module.
        provider:
          type: string
          description: The provider that manages it (e.g. registry.opentofu.org/hashicorp/aws).
        id:
          description: |
            The provider-assigned identifier (an instance id, an ARN, a name)
            — usually a string; null when the resource has none.
          nullable: true

    ScopedRunRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          description: |
            `uninstall` destroys the component (a gated destroy plan + apply);
            `deploy` plans and applies just this component.
          enum: [deploy, uninstall]
        targets:
          type: array
          description: |
            Resource addresses to limit the run to, e.g. `aws_instance.web`
            or `module.vpc.aws_subnet.private[0]` — each becomes a `-target`
            flag on the plan. Omit to cover the whole component.
          items:
            type: string

    RunScope:
      type: object
      description: |
        Present on a run limited to one OpenTofu component (see the
        component's runs endpoint): the component and, when the run was
        targeted, the resource addresses it was limited to. Absent on a
        whole-workflow run.
      required: [component_id, component_name]
      properties:
        component_id:
          type: string
          format: uuid
        component_name:
          type: string
          description: The component's name when the run began.
        targets:
          type: array
          items:
            type: string

    StateOperationKind:
      type: string
      description: |
        The fixed menu of guarded state operations: `force_unlock` releases a
        stuck state lock (needs `lock_id`), `rm` stops managing a resource
        without destroying it (needs `address`), `mv` renames a resource in
        state (needs `address` and `new_address`), `import` adopts existing
        infrastructure into state (needs `address` and `import_id`).
      enum: [force_unlock, rm, mv, import]

    StateOperationRequest:
      type: object
      required: [operation]
      properties:
        operation:
          $ref: "#/components/schemas/StateOperationKind"
        address:
          type: string
          description: The resource address (rm, mv, import), e.g. `aws_instance.web`.
        new_address:
          type: string
          description: The destination address of a move (mv).
        lock_id:
          type: string
          description: The lock id to release (force_unlock), from the lock error.
        import_id:
          type: string
          description: The provider-specific identifier to import (import).

    StateOperation:
      type: object
      description: |
        The operation a `state_op` run performs, as requested, plus the
        exact command its single step runs (what an approver reviews).
      required: [operation, command]
      properties:
        operation:
          $ref: "#/components/schemas/StateOperationKind"
        address:
          type: string
        new_address:
          type: string
        lock_id:
          type: string
        import_id:
          type: string
        command:
          type: string
          description: |
            The command the step runs after `tofu init`, e.g.
            `tofu state rm aws_instance.web`. An import also carries the
            component's `-var`/`-var-file` plan flags.

    ComponentState:
      type: object
      description: |
        An OpenTofu (Terraform) component's last recorded state: the outputs
        and managed-resource inventory captured by its most recent successful
        apply, and the run that captured them. Before any apply has recorded
        state the view is returned only when there is a stuck lock to show
        (editors): then `run_id` / `component_run_id` are absent and
        `resources` is empty.
      required: [resources]
      properties:
        run_id:
          type: string
          format: uuid
          description: The workflow run whose apply recorded this state; absent when nothing is recorded yet.
        component_run_id:
          type: string
          format: uuid
          description: The apply step (component run) that recorded it; absent when nothing is recorded yet.
        recorded_at:
          type: string
          format: date-time
          nullable: true
          description: When that apply step settled.
        outputs:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ComponentRunOutput"
          description: |
            The module's output values, keyed by name. Absent when the module
            has none. Sensitive values are omitted below editor.
        resources:
          type: array
          description: Every resource and data source in the module's state, in state order.
          items:
            $ref: "#/components/schemas/TofuResource"
        drift:
          $ref: "#/components/schemas/DriftStatus"
        lock:
          $ref: "#/components/schemas/StateLock"

    StateLock:
      type: object
      description: |
        A state lock the component's most recent run could not acquire — one
        left behind by a run that died mid-operation. Parsed from that failed
        step's "Error acquiring the state lock" message, so `id` is exactly
        what a `force_unlock` state operation needs, and `who` / `created` /
        `operation` say who held it and since when. Present only while the
        component's latest settled step failed on the lock (a later step that
        got through clears it), and only for editors — it names the state's
        location.
      required: [run_id, component_run_id, id]
      properties:
        run_id:
          type: string
          format: uuid
          description: The run whose step hit the lock.
        component_run_id:
          type: string
          format: uuid
          description: That step.
        failed_at:
          type: string
          format: date-time
          nullable: true
          description: When the step failed.
        id:
          type: string
          description: The lock id, as printed by OpenTofu.
        path:
          type: string
          description: The state's path in the backend.
        operation:
          type: string
          description: The operation that took the lock (e.g. OperationTypeApply).
        who:
          type: string
          description: Who took it (user@host, as OpenTofu recorded it).
        version:
          type: string
          description: The OpenTofu version that took it.
        created:
          type: string
          description: When it was taken, as OpenTofu printed it.
        info:
          type: string

    DriftStatus:
      type: object
      description: |
        The result of an OpenTofu component's most recent drift check: whether
        real infrastructure still matched the last apply, and which resources
        had changed outside of OpenTofu. Absent until a drift check has run.
      required: [run_id, component_run_id, status, has_drift]
      properties:
        run_id:
          type: string
          format: uuid
          description: The drift-check run.
        component_run_id:
          type: string
          format: uuid
          description: The component's step within it.
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: When the check settled.
        status:
          $ref: "#/components/schemas/ComponentRunStatus"
        has_drift:
          type: boolean
          description: |
            Whether the check found drift. False when the check itself failed
            (see status) — the verdict is then unknown, not clean.
        drift:
          type: array
          description: The drifted resources (addresses and actions; no diffs).
          items:
            $ref: "#/components/schemas/PlanResourceChange"

    ComponentOutputKey:
      type: object
      description: |
        The name (and metadata) of one captured OpenTofu (Terraform) output
        from a component's latest successful run — keys only, never the value.
        Powers editor autocomplete of `${{ components.<name>.outputs.<key> }}`.
      required: [key, sensitive]
      properties:
        key:
          type: string
          description: The output name (the `<key>` in an outputs reference).
        type:
          type: string
          description: |
            The output's OpenTofu type descriptor (tofu's `type` JSON, as a
            string), a display hint. Omitted when unknown.
        sensitive:
          type: boolean
          description: Whether the module marked this output sensitive.

    ComponentOutputKeys:
      type: object
      description: |
        Per-component known output keys, keyed by component id. Only components
        whose latest successful run captured outputs appear. Keys only — never
        the values (and so nothing here is redacted).
      additionalProperties:
        type: array
        items:
          $ref: "#/components/schemas/ComponentOutputKey"

    ComponentRunDetail:
      allOf:
        - $ref: "#/components/schemas/ComponentRun"
        - type: object
          properties:
            logs:
              type: string
              description: |
                The captured output, persisted when the step settled. Empty while
                still in flight (follow it live via the log stream).
            diff:
              type: string
              description: |
                The parsed change body. For a Helm or Manifest step on a preview
                (dry-run) run, the diff of what deploying would change on the
                live cluster; for an OpenTofu plan step on any run, the plan
                text (the review material). Empty otherwise, and while the step
                is still in flight.
            has_changes:
              type: boolean
              description: |
                Whether the step's diff/plan would change anything: the live
                cluster for a Helm/Manifest preview, infrastructure or outputs
                for an OpenTofu plan. False for other steps.
            resources:
              type: array
              description: |
                For an OpenTofu apply step that succeeded on a deploy run, the
                inventory of resources the module manages as of that apply.
                Absent for every other step.
              items:
                $ref: "#/components/schemas/TofuResource"
    WorkflowRunDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowRun"
        - type: object
          required: [component_runs]
          properties:
            component_runs:
              type: array
              items:
                $ref: "#/components/schemas/ComponentRun"
            graph:
              type: string
              description: |
                JSON snapshot of the workflow (stages, plus each execution step
                with its config and the steps it waits on) as it was when the
                run began. Secret-bearing config is redacted for callers below
                editor.

    Variable:
      type: object
      description: |
        A named key/value passed to component jobs as an environment variable,
        defined at the group level (every application in the group), the app
        level (every component), or the component level. Lower levels are
        overridden by higher: group < app < component for a same-named variable.
        A sensitive variable's value is sealed at rest and never returned — only
        its name and the sensitive flag are.
      required: [id, name, sensitive, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: The environment variable name (a shell-safe identifier).
        sensitive:
          type: boolean
          description: |
            When true, the value is sealed at rest and never returned (write-only,
            it can only be replaced).
        value:
          type: string
          description: |
            The plaintext value. Present only for non-sensitive variables; a
            sensitive variable's value is never returned.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    VariableCreateRequest:
      type: object
      required: [name, sensitive, value]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: A shell-safe identifier, unique within the variable's scope.
        sensitive:
          type: boolean
          description: |
            When true, the value is sealed at rest and never returned. Fixed at
            creation (delete and recreate to change).
        value:
          type: string
          description: |
            The value. Required (a sensitive variable's must be non-empty); for a
            non-sensitive variable an empty string is allowed.

    VariableUpdateRequest:
      type: object
      description: |
        All fields optional. Omit `value` to leave it unchanged — the only way to
        keep a sensitive value, which is never returned. The sensitive flag is
        fixed at creation.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: string

