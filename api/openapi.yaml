openapi: 3.0.3
info:
  title: Spacefleet API
  version: 0.1.0
  description: |
    HTTP API for the Spacefleet app. This is the source of truth: it
    generates the Go server stubs (lib/api/gen.go) and the TypeScript
    client types (ui/src/api/schema.d.ts). Run `make gen` after editing.

    Account management is organization-centric: organizations are the
    top-level tenant and a user must belong to (and have selected) one to use
    the app. /api/me bootstraps the SPA with the current user and their
    organization memberships.
servers:
  - url: /
paths:
  /api/health:
    get:
      summary: Liveness probe
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /api/me:
    get:
      summary: The current user and their organization memberships
      description: |
        Returns the authenticated user, provisioning a local record on first
        sight, along with the organizations they belong to. The SPA uses this
        to bootstrap: an empty organizations list means the user must create
        one before using the app.
      operationId: getMe
      responses:
        "200":
          description: Current user and memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"

  /api/organizations:
    post:
      summary: Create an organization (the caller becomes its first admin)
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /api/organizations/{id}:
    patch:
      summary: Rename an organization (admins only)
      operationId: renameOrganization
      parameters:
        - $ref: "#/components/parameters/OrganizationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /api/members:
    get:
      summary: List the members of the current organization
      description: |
        Org-scoped (X-Organization-ID). Any member may view the roster; only
        admins can change roles or remove members.
      operationId: listMembers
      responses:
        "200":
          description: Members of the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"

  /api/members/{userId}:
    patch:
      summary: Change a member's role (admins only)
      description: |
        Org-scoped (X-Organization-ID). Admin-only. The organization must keep
        at least one admin, so demoting the last admin is rejected with 409.
      operationId: updateMemberRole
      parameters:
        - $ref: "#/components/parameters/MemberUserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdateRequest"
      responses:
        "200":
          description: The updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove a member from the organization (admins only)
      description: |
        Org-scoped (X-Organization-ID). Admin-only. The organization must keep
        at least one admin, so removing the last admin is rejected with 409.
      operationId: removeMember
      parameters:
        - $ref: "#/components/parameters/MemberUserID"
      responses:
        "204":
          description: Member removed
        default:
          $ref: "#/components/responses/Error"

  /api/invitations:
    get:
      summary: List pending invitations for the current organization (admins only)
      description: Org-scoped (X-Organization-ID). Admin-only.
      operationId: listInvitations
      responses:
        "200":
          description: Pending invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Invite a user to the current organization (admins only)
      description: |
        Org-scoped (X-Organization-ID). Admin-only. Creates a pending invitation
        and returns a copy-able accept link. When email is configured an
        invitation email is also sent (email_sent reflects whether it was
        enqueued); otherwise the admin shares the link manually.
      operationId: createInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationCreateRequest"
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationCreateResult"
        default:
          $ref: "#/components/responses/Error"

  /api/invitations/{id}:
    delete:
      summary: Revoke a pending invitation (admins only)
      description: Org-scoped (X-Organization-ID). Admin-only. Invalidates the invite link.
      operationId: revokeInvitation
      parameters:
        - $ref: "#/components/parameters/InvitationID"
      responses:
        "204":
          description: Invitation revoked
        default:
          $ref: "#/components/responses/Error"

  /api/invites/{token}:
    get:
      summary: Preview an invitation by its token
      description: |
        Token-scoped (not org-scoped). Returns what the invite is for so the
        accept screen can show the organization and role, and whether the link
        is still usable. Requires a signed-in user.
      operationId: getInvitation
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: The invitation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        default:
          $ref: "#/components/responses/Error"

  /api/invites/{token}/accept:
    post:
      summary: Accept an invitation and join its organization
      description: |
        Token-scoped (not org-scoped). The signed-in user joins the invitation's
        organization with the invitation's role; the token is the sole authority
        (the invited email is not checked against the caller). Idempotent for a
        user who already belongs to the organization. Returns the joined
        organization so the SPA can select it.
      operationId: acceptInvitation
      parameters:
        - $ref: "#/components/parameters/InviteToken"
      responses:
        "200":
          description: The organization the user joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters:
    get:
      summary: List the clusters registered to the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
        Secret credentials are never included in the response.
      operationId: listClusters
      responses:
        "200":
          description: Clusters in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register a Kubernetes cluster in the current organization
      description: |
        Stores the connection details (credentials are envelope-encrypted at
        rest) and immediately probes the cluster, returning it with the
        resulting connection status.
      operationId: createCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterCreateRequest"
      responses:
        "201":
          description: Cluster registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}:
    get:
      summary: Get a cluster
      operationId: getCluster
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a cluster (name and/or credentials)
      description: |
        Updates the cluster's name and/or re-supplies credentials. The
        connection method is fixed at registration. Supplying any credential
        field re-encrypts and re-probes.
      operationId: updateCluster
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterUpdateRequest"
      responses:
        "200":
          description: Cluster updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a cluster
      operationId: deleteCluster
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "204":
          description: Cluster deleted
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/test:
    post:
      summary: Re-probe a cluster's connectivity
      description: Rebuilds the client from stored credentials and refreshes the connection status.
      operationId: testCluster
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster with refreshed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/nodes:
    get:
      summary: List the Kubernetes nodes of a cluster
      description: |
        Org-scoped: builds a client from the cluster's stored credentials and
        lists its nodes live from the Kubernetes API. The cluster must be
        reachable; an unreachable cluster yields a 502.
      operationId: listClusterNodes
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/namespaces:
    get:
      summary: List the Kubernetes namespaces of a cluster
      description: |
        Org-scoped: builds a client from the cluster's stored credentials and
        lists its namespaces live from the Kubernetes API. The cluster must be
        reachable; an unreachable cluster yields a 502.
      operationId: listClusterNamespaces
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's namespaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Namespace"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/pods:
    get:
      summary: List the Kubernetes pods of a cluster
      description: |
        Org-scoped: builds a client from the cluster's stored credentials and
        lists its pods across all namespaces live from the Kubernetes API. The
        cluster must be reachable; an unreachable cluster yields a 502.
      operationId: listClusterPods
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's pods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pod"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/releases:
    get:
      summary: List the Helm releases installed on a cluster
      description: |
        Org-scoped: builds a client from the cluster's stored credentials and
        lists the Helm releases installed on it, decoded from the release Secrets
        Helm writes (the default `secret` storage driver). Only the newest
        revision of each release is returned. This is the discovery step behind
        importing an existing release as an application. The cluster must be
        reachable; an unreachable cluster yields a 502.
      operationId: listClusterReleases
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - name: namespace
          in: query
          required: false
          description: |
            Restrict discovery to one namespace. Omit to list releases across all
            namespaces.
          schema:
            type: string
      responses:
        "200":
          description: The cluster's Helm releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelmRelease"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/capabilities:
    get:
      summary: Report the cluster credentials' access (capabilities)
      description: |
        Org-scoped: builds a client from the cluster's stored credentials,
        resolves the identity they map to, and checks — live against the
        Kubernetes API — which product capabilities the credentials are allowed.
        Each capability is reported as allowed or denied; denied capabilities
        carry the missing RBAC rules that explain why. To grant a selection of
        capabilities, generate a manifest via the capabilities/rbac endpoint. The
        cluster must be reachable; an unreachable cluster yields a 502.
      operationId: listClusterCapabilities
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster credentials' capability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterCapabilities"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/capabilities/rbac:
    post:
      summary: Generate an RBAC manifest for selected capabilities
      description: |
        Org-scoped: builds a single ClusterRole + ClusterRoleBinding granting the
        complete rule set the selected capabilities require, bound to the identity
        the cluster's stored credentials resolve to. Unlike the capability report
        (which only describes what is currently missing), this grants each
        selected capability's full rule set so the manifest is self-contained
        regardless of what is already allowed. For connection
        methods with no addressable in-cluster subject (kubeconfig, eks, gke, aks)
        it returns best-effort guidance rather than a directly applicable manifest.
      operationId: generateClusterRbac
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterRbacRequest"
      responses:
        "200":
          description: The generated RBAC manifest (or guidance)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterRbac"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton:
    get:
      summary: Report a cluster's Tekton (job-running) status
      description: |
        Org-scoped: returns whether the cluster is designated to run jobs and the
        Tekton install lifecycle, reconciled with a live presence detection
        (whether Tekton is installed and the controller is ready). An unreachable
        cluster yields a 502. Live install progress is available as a stream at
        /api/clusters/{id}/tekton/stream.
      operationId: getClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's Tekton status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/enable:
    post:
      summary: Designate a cluster to run jobs (install Tekton)
      description: |
        Org-scoped, editor or above. Marks the cluster as a job runner and, when
        Tekton isn't installed yet, enqueues a background job that installs the
        pinned Tekton release into the cluster. Returns immediately (202); follow
        progress via the Tekton status stream.
      operationId: enableClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "202":
          description: Enable accepted; install (if needed) is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/plugin-cache:
    put:
      summary: Configure the OpenTofu provider plugin cache on a runner cluster
      description: |
        Org-scoped, editor or above. Sets up (or removes) a shared provider
        plugin cache for OpenTofu steps on this runner cluster: a
        PersistentVolumeClaim in the jobs namespace, mounted into every OpenTofu
        step as its plugin cache directory, so providers are downloaded once
        per cluster rather than once per run. `size` is the claim's requested
        storage (a Kubernetes quantity such as `20Gi`); an empty size removes
        the cache (the claim is deleted). `storage_class` optionally names the
        StorageClass; it must support ReadWriteMany for steps to schedule on
        any node. The claim is created (or deleted) on the cluster right away;
        a cluster that cannot be reached is a 502.
      operationId: setClusterTektonPluginCache
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TektonPluginCache"
      responses:
        "200":
          description: The cluster's Tekton status with the cache settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/disable:
    post:
      summary: Stop designating a cluster as a job runner
      description: |
        Org-scoped, editor or above. Clears the job-runner flag. It does not
        uninstall Tekton from the cluster.
      operationId: disableClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "200":
          description: The cluster's Tekton status after disabling
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/upgrade:
    post:
      summary: Update a Spacefleet-managed Tekton install
      description: |
        Org-scoped, editor or above. Re-applies the full install manifest set
        to a cluster whose Tekton was installed by Spacefleet — upgrading it to
        the pinned version, syncing a footprint that drifted from what this
        Spacefleet expects (see TektonStatus.update_available), and repairing a
        failed/partial install. Only available when the install is
        Spacefleet-managed; returns 409 otherwise, and 409 if Tekton is not
        installed. Returns immediately (202); follow progress via the Tekton
        status stream.
      operationId: upgradeClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "202":
          description: Upgrade accepted; the upgrade job is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/uninstall:
    post:
      summary: Remove a Spacefleet-managed Tekton install
      description: |
        Org-scoped, editor or above. Removes the Tekton release Spacefleet
        installed (and clears the job-runner flag). Only available when the
        install is Spacefleet-managed; returns 409 for a Tekton installed
        outside Spacefleet, which is never removed. Returns immediately (202);
        follow progress via the Tekton status stream.
      operationId: uninstallClusterTekton
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      responses:
        "202":
          description: Uninstall accepted; the uninstall job is in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonStatus"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/runs:
    post:
      summary: Submit a job (TaskRun) to a cluster
      description: |
        Org-scoped, editor or above. Submits a minimal single-step TaskRun and
        returns its initial status. Watch its status at
        /api/clusters/{id}/tekton/runs/{name}/stream and its logs via the pod-log
        stream once a pod name is reported.
      operationId: submitClusterTektonRun
      parameters:
        - $ref: "#/components/parameters/ClusterID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TektonRunRequest"
      responses:
        "201":
          description: The submitted run's initial status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonRun"
        default:
          $ref: "#/components/responses/Error"

  /api/clusters/{id}/tekton/runs/{name}:
    get:
      summary: Get a job (TaskRun) status
      description: "Org-scoped: returns the current status of one TaskRun by name."
      operationId: getClusterTektonRun
      parameters:
        - $ref: "#/components/parameters/ClusterID"
        - name: name
          in: path
          required: true
          description: The TaskRun name.
          schema:
            type: string
      responses:
        "200":
          description: The run's current status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TektonRun"
        default:
          $ref: "#/components/responses/Error"

  /api/runs:
    get:
      summary: List all workflow runs in the current organization
      description: |
        Org-scoped. Returns workflow runs across every application in the
        organization, newest-first, for a global deploy-history view. The list is
        capped (newest runs); filtering by application or cluster is done by the
        client. Each run carries its application_id; component runs and the graph
        snapshot are not included — fetch a single run for those. A live stream of
        the same list is available at /api/runs/stream (Server-Sent Events).
      operationId: listAllRuns
      responses:
        "200":
          description: The organization's workflow runs, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunList"
        default:
          $ref: "#/components/responses/Error"

  /api/applications:
    get:
      summary: List the applications in the current organization
      description: |
        Org-scoped: the organization is taken from the X-Organization-ID header.
      operationId: listApplications
      responses:
        "200":
          description: Applications in the current organization
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"
    post:
      summary: Register an application in the current organization
      description: |
        Org-scoped, editor or above. Persists the application in the pending
        state; it does not start a rollout (POST .../rollout for that).
      operationId: createApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateRequest"
      responses:
        "201":
          description: Application registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/import:
    post:
      summary: Adopt an existing Helm release as an application
      description: |
        Org-scoped, editor or above. Adopts a release already running on the
        target cluster (discovered via GET /api/clusters/{id}/releases) as a
        managed application, seeded with the release's live values. The release
        is already deployed, so this does NOT run a rollout — the application is
        created in the deployed state. When the background worker is available it
        immediately enqueues a refresh (a `helm diff`) so the sync status shows
        whether the configured chart source reproduces the live release. Returns
        202 (the app, with the refresh in flight when enqueued).
      operationId: importApplication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationImportRequest"
      responses:
        "202":
          description: Application adopted; a refresh is in progress when enqueued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}:
    get:
      summary: Get an application
      operationId: getApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "200":
          description: The application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"
    patch:
      summary: Update an application
      description: |
        Org-scoped, editor or above. Updates mutable fields (name, chart
        coordinates, values, release name, target namespace). The clusters and
        chart source are fixed at registration.
      operationId: updateApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdateRequest"
      responses:
        "200":
          description: Application updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete an application
      operationId: deleteApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      responses:
        "204":
          description: Application deleted
        default:
          $ref: "#/components/responses/Error"

  /api/applications/{id}/group:
    put:
      summary: Move an application into a group (or to the org root)
      description: |
        Org-scoped, editor or above. Sets the application's group membership. The
        request's group_id is always present: a uuid moves the application into
        that group (which must belong to the same organization), and null removes
        it from any group (back to the org root).
      operationId: setApplicationGroup
      parameters:
        - $ref: "#/components/parameters/ApplicationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationGroupAssignment"
      responses:
        "200":
          description: Application moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
