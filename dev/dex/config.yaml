# Dex configuration for LOCAL DEVELOPMENT ONLY.
#
# This bootstraps a self-contained OIDC provider so the app is runnable and
# loginnable out of the box (see docker-compose.yml). It uses in-memory
# storage and a hard-coded static user — never use this config in production.
#
# Issuer is the APP origin (:2424) under /dex, not Dex's own :5556. The app is
# the single front door: the browser reaches Dex same-origin via the Vite proxy
# (/dex -> :8080 Go backend -> :5556 Dex reverse proxy), so there is no
# cross-origin call and no CORS to configure. The Go backend still verifies
# tokens by fetching keys directly from Dex (OIDC_JWKS_URL=:5556/dex/keys),
# exactly mirroring the in-cluster bundled-Dex setup. Dex serves all its routes
# under this issuer path (/dex).
issuer: http://localhost:2424/dex

storage:
  type: memory

web:
  http: 0.0.0.0:5556

# Skip the consent screen — there's a single trusted dev client.
oauth2:
  skipApprovalScreen: true

# The SPA is a public client doing Authorization Code + PKCE (no client
# secret). One redirect URI: the app's canonical dev origin (:2424).
staticClients:
  - id: spacefleet
    name: Spacefleet
    public: true
    redirectURIs:
      - http://localhost:2424/auth/callback

# A single static dev login. Credentials: admin@example.com / "password".
# The hash is bcrypt("password"); regenerate with:
#   htpasswd -bnBC 10 "" <newpassword> | tr -d ':\n'
enablePasswordDB: true
staticPasswords:
  - email: admin@example.com
    hash: "$2y$10$BFlbl0.lcQSwywdpBVArUuBjeOAgb37/kb7Lyy8I.rB08PxAKFV0m"
    username: admin
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
