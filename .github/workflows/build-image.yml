name: Build image (manual)

# On-demand image builds for testing/validation, decoupled from the v*-tag
# release path in ci.yml. Pick a branch (or any ref) and the tag to publish it
# under; the image is pushed to the same GHCR repo as releases, plus an
# immutable sha-<commit> tag so you can always tell what's actually running.
#
# This lane is intentionally NOT gated by the lint/test matrix — it's for fast
# iteration. The semver/latest tags and the OCI Helm chart remain reserved for
# real v* releases.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or ref to build"
        required: true
        default: main
      tag:
        description: "Image tag to publish (e.g. dev, my-feature, pr-123)"
        required: true
      platforms:
        description: "Target platforms"
        required: true
        default: linux/amd64,linux/arm64
        type: choice
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64

# Serialise builds that publish the same tag so two dispatches can't race to
# overwrite it.
concurrency:
  group: build-image-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve image name and commit
        id: meta
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ inputs.tag }}
            ${{ env.IMAGE }}:sha-${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.ref.name=${{ inputs.branch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo ""
            echo "- \`${IMAGE}:${{ inputs.tag }}\`"
            echo "- \`${IMAGE}:sha-${{ steps.meta.outputs.sha }}\` (immutable)"
            echo ""
            echo "Built from \`${{ inputs.branch }}\` @ \`${{ steps.meta.outputs.sha }}\` for \`${{ inputs.platforms }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
