apiVersion: v2
name: spacefleet
description: Spacefleet — a Go + React single-binary app (API + embedded SPA) with Postgres and OIDC auth.
type: application

# version (chart) and appVersion (image tag) are both stamped from the v* git
# tag at release time by CI (see .github/workflows/ci.yml). The committed
# values below are placeholders for local development and `helm lint`.
version: 0.0.0
appVersion: "0.0.0"

home: https://github.com/spacefleet/spacefleet
sources:
  - https://github.com/spacefleet/spacefleet
keywords:
  - spacefleet
  - go
  - react
  - openapi

# Postgres is bundled as a small first-party StatefulSet running the official
# upstream image (postgres on Docker Hub). Enabled by default so `helm install`
# yields a working app out of the box; disable it (postgresql.enabled=false) and
# point at a managed service via externalDatabase for production. The bundled
# datastore is single-replica and intended for trials and small deployments, not
# HA.
#
# Dex is Spacefleet's identity provider and is ALWAYS bundled — it's an internal
# part of the platform, not an optional add-on, via the official dexidp/dex
# subchart below (no enable/disable toggle). That dependency means
# `helm dependency build` must run before lint/package (CI and the Makefile do
# this), and a Chart.lock is committed. The app reverse-proxies Dex same-origin
# under /dex, so Dex's Service stays internal and is never ingressed directly.

dependencies:
  - name: dex
    version: 0.24.1
    repository: https://charts.dexidp.io
