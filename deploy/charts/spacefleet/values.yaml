# Default values for the spacefleet chart.
# This is a YAML-formatted file. Values are documented inline; see
# deploy/charts/spacefleet/README.md for the full reference and examples.

# -- Number of `serve` (web/API) replicas. Ignored when web.autoscaling.enabled.
replicaCount: 2

image:
  # -- Image repository. CI publishes to ghcr.io/spacefleet/app.
  repository: ghcr.io/spacefleet/app
  # -- Image tag. Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# -- Secrets for pulling the app image (and bundled Postgres/Redis images) from
# a private registry. List of {name: <secret>}.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Application configuration. Non-secret values are injected as plain env on
# the web/worker pods (the OIDC ones are also surfaced to the browser via
# /config.js). Secrets (DATABASE_URL, REDIS_URL) are handled separately — see
# postgresql / externalDatabase below.
config:
  # -- ENV the binary runs under (production|development).
  env: production
  # -- Address the HTTP server binds. Keep in sync with service.targetPort.
  addr: ":8080"
  oidc:
    # -- OIDC client ID the app authenticates as. Spacefleet always uses its
    # bundled Dex (see the `dex` block) — there is no external-provider or
    # passthrough mode. The issuer is derived automatically (the app's own
    # origin + /dex), so there is no issuer knob here. Keep this in sync with
    # dex.clientID (the static client the chart registers in Dex).
    clientID: spacefleet
  # -- Max background jobs the worker process runs in parallel.
  workerConcurrency: 4
  # -- Extra environment variables for both web and worker pods. Standard
  # core/v1 EnvVar entries, e.g. [{name: FOO, value: bar}].
  extraEnv: []
  # -- Extra volumes mounted on the web, worker, AND migrate pods. Standard
  # core/v1 Volume entries. Pair with extraVolumeMounts to land custom TLS
  # assets — e.g. an RDS CA bundle for `sslmode=verify-full&sslrootcert=...`.
  # See docs/operator/database.md.
  extraVolumes: []
  # -- Extra volumeMounts for the app containers (web, worker, migrate).
  # Standard core/v1 VolumeMount entries referencing extraVolumes by name.
  extraVolumeMounts: []

# Web (the `serve` subcommand): stateless HTTP API + embedded SPA.
web:
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Worker (the `worker` subcommand): River background-job processor.
worker:
  # -- Deploy the background worker. Disable if you have no registered jobs yet.
  enabled: true
  replicaCount: 1
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database migrations (`migrate up`), run as a pre-install/pre-upgrade Helm
# hook Job before web/worker roll out.
migrations:
  enabled: true
  # -- Job backoffLimit (retries on failure, e.g. DB not yet reachable).
  backoffLimit: 6
  resources: {}
  annotations: {}
  # -- Scheduling for the migrate hook Job. This is a blocking install/upgrade
  # hook, so if your nodes are tainted or web/worker target a specific pool,
  # set these to match — otherwise an unschedulable migrate pod stalls the
  # whole release.
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  # -- Service port. Routes to the pod's targetPort.
  port: 80
  # -- Container port the app listens on. Must match config.addr.
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: spacefleet.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: spacefleet-tls
    #   hosts:
    #     - spacefleet.local

serviceAccount:
  create: true
  name: ""
  annotations: {}

# Pod- and container-level security. Defaults match the distroless/static
# nonroot runtime image (uid/gid 65532, read-only rootfs, no privilege).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# HTTP probes against the public /api/health endpoint.
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# ---------------------------------------------------------------------------
# Bundled Postgres — a single-replica StatefulSet running the official postgres
# image. Enabled by default for a one-command trial. For production, prefer
# postgresql.enabled=false + externalDatabase (a managed/HA database).
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  # -- Official Postgres image. Matches docker-compose for dev/prod parity.
  image: postgres:18-alpine
  imagePullPolicy: IfNotPresent
  auth:
    username: spacefleet
    # -- Bundled-Postgres password. CHANGE THIS for any real deployment, or
    # disable the bundle and use a managed database.
    password: spacefleet
    database: spacefleet
  persistence:
    enabled: true
    size: 8Gi
    # -- StorageClass for the data PVC. Empty uses the cluster default.
    storageClass: ""
  resources: {}
  # -- Pod securityContext for the Postgres pod. Empty lets the official image
  # manage its own user (root entrypoint → drops to postgres). Set fsGroup/
  # runAsUser to run under "restricted" PodSecurity (see README).
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Used only when postgresql.enabled=false. Provide a full DSN via `url`, or a
# reference to an existing Secret holding it.
externalDatabase:
  # -- Full Postgres DSN, e.g. postgres://user:pass@host:5432/db?sslmode=require
  url: ""
  # -- Name of an existing Secret containing the DSN (takes precedence over url).
  existingSecret: ""
  # -- Key within existingSecret holding the DSN.
  existingSecretKey: DATABASE_URL

# ---------------------------------------------------------------------------
# Bundled Redis — a single-replica StatefulSet running the official redis image.
# ---------------------------------------------------------------------------
redis:
  enabled: true
  # -- Official Redis image. Matches docker-compose for dev/prod parity.
  image: redis:7-alpine
  imagePullPolicy: IfNotPresent
  auth:
    enabled: true
    # -- Bundled-Redis password. CHANGE THIS for any real deployment.
    password: spacefleet
  persistence:
    enabled: true
    size: 8Gi
    # -- StorageClass for the data PVC. Empty uses the cluster default.
    storageClass: ""
  resources: {}
  # -- Pod securityContext for the Redis pod. See postgresql.podSecurityContext.
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Used only when redis.enabled=false.
externalRedis:
  # -- Full Redis URL, e.g. redis://:pass@host:6379/0
  url: ""
  # -- Name of an existing Secret containing the URL (takes precedence over url).
  existingSecret: ""
  # -- Key within existingSecret holding the URL.
  existingSecretKey: REDIS_URL

# ---------------------------------------------------------------------------
# Bundled Dex — Spacefleet's identity provider, via the official dexidp/dex
# subchart. ALWAYS bundled: it's an internal part of the platform, not an
# optional add-on, so there is no enable/disable toggle. You don't point the app
# at an external IdP; instead you configure Dex's connectors (below) to federate
# to GitHub/Google/Okta/Entra/LDAP/SAML/etc. The app always trusts Dex.
#
# The app reverse-proxies Dex same-origin under /dex, so the issuer is derived
# as the app's own origin + /dex (https://<first ingress host>/dex with ingress,
# or http://localhost:8080/dex for a port-forward trial) — no issuer knob, no
# CORS, no separate Dex host to expose.
#
# This chart RENDERS Dex's config (the app's PKCE client + redirect URIs,
# storage, connectors) from the values below and hands it to the subchart as an
# existing Secret; the subchart owns the Deployment/Service/RBAC. Keys under
# `dex` that aren't listed here are passed straight through to the dexidp/dex
# subchart (resources, nodeSelector, image, autoscaling, …).
dex:
  # ---- Dex config rendered by this chart -------------------------------------

  # -- The app's OIDC client id registered in Dex. Keep in sync with
  # config.oidc.clientID. Registered as a public (PKCE) client, no secret.
  clientID: spacefleet
  # -- Signing/session storage: crd (Kubernetes CRDs, no DB) | postgres | memory
  # | sqlite3. crd is durable and HA-safe with no extra dependency. memory is
  # single-replica/trial only (new signing keys on every restart).
  storage: crd
  # -- Extra storage.config keys merged into the rendered config (e.g. a
  # postgres DSN for storage=postgres). For crd, {inCluster: true} is the default.
  storageConfig: {}

  # -- Seed Dex's local password DB so a fresh install is immediately loginnable.
  enablePasswordDB: true
  # -- Static users. The default seeds admin@example.com / "password" so trials
  # work out of the box. CHANGE THIS (or clear it and configure a connector)
  # before exposing the deployment — this is a publicly known credential.
  # Regenerate a hash with: htpasswd -bnBC 10 "" <pw> | tr -d ':\n'
  staticPasswords:
    - email: admin@example.com
      hash: "$2y$10$BFlbl0.lcQSwywdpBVArUuBjeOAgb37/kb7Lyy8I.rB08PxAKFV0m"
      username: admin
      userID: "5a9f6c2e-9b1a-4f3d-8c7b-2e4d6a8f0c11"

  # -- Upstream identity connectors (GitHub, Google, OIDC, LDAP, …), passed
  # through verbatim to Dex's `connectors:`. Dex expands $VAR references at load,
  # so keep client secrets out of values: reference them as env (see dex.envFrom
  # below) instead of inlining. Example (GitHub):
  #   connectors:
  #     - type: github
  #       id: github
  #       name: GitHub
  #       config:
  #         clientID: <oauth app id>
  #         clientSecret: $GITHUB_CLIENT_SECRET
  #         orgs: [{name: your-org}]
  connectors: []

  # -- Additional OIDC clients beyond the app's own (verbatim Dex staticClients).
  extraStaticClients: []
  # -- Extra redirect URIs for the app client, beyond the auto-derived
  # https://<each ingress host>/auth/callback.
  extraRedirectURIs: []
  # -- Dex oauth2 settings (passthrough). skipApprovalScreen avoids a consent
  # click for the first-party app.
  oauth2:
    skipApprovalScreen: true
  web:
    # -- CORS origins for browser→Dex calls. Not needed in normal operation:
    # the browser reaches Dex same-origin through the app's /dex proxy, so there
    # are no cross-origin calls. Left as a passthrough for unusual setups.
    allowedOrigins: []
  # -- Token/key lifetimes (Dex `expiry:` passthrough), e.g. {idTokens: 24h}.
  expiry: {}

  # ---- dexidp/dex subchart passthrough ---------------------------------------
  # This chart renders the config Secret, so the subchart must not create one;
  # both sides reference dex.configSecret.name. For multiple spacefleet releases
  # in one namespace, give each a unique name here.
  configSecret:
    create: false
    name: spacefleet-dex-config
  # RBAC defaults (create + createClusterScoped) grant the namespaced
  # dex.coreos.com role and the cluster-scoped CRD permissions that storage=crd
  # needs. For storage=postgres/memory you can set createClusterScoped=false.
  rbac:
    create: true
    createClusterScoped: true
  serviceAccount:
    create: true
  replicaCount: 1
  https:
    enabled: false
  grpc:
    enabled: false
  # -- envFrom for the Dex pod (subchart passthrough). Use this to inject
  # connector client secrets that the `connectors` config references as $VAR,
  # e.g. [{secretRef: {name: spacefleet-dex-connectors}}].
  envFrom: []
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
