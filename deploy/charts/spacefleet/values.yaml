# Default values for the spacefleet chart.
# This is a YAML-formatted file. Values are documented inline; see
# deploy/charts/spacefleet/README.md for the full reference and examples.

# -- Number of `serve` (web/API) replicas. Ignored when web.autoscaling.enabled.
replicaCount: 2

image:
  # -- Image repository. CI publishes to ghcr.io/spacefleet/spacefleet.
  repository: ghcr.io/spacefleet/spacefleet
  # -- Image tag. Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# -- Secrets for pulling the app image (and bundled Postgres image) from
# a private registry. List of {name: <secret>}.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Application configuration. Non-secret values are injected as plain env on
# the web/worker pods (the OIDC ones are also surfaced to the browser via
# /config.js). Secrets (DATABASE_URL) are handled separately — see
# postgresql / externalDatabase below.
config:
  # -- ENV the binary runs under (production|development).
  env: production
  # -- Address the HTTP server binds. Keep in sync with service.targetPort.
  addr: ":8080"
  # -- REQUIRED. The canonical public base URL the browser reaches the app at,
  # with no trailing slash, e.g. "https://spacefleet.example.com" (or
  # "http://localhost:8080" for a port-forward trial). This is the single source
  # of truth for every external URL: the OIDC issuer (<externalURL>/dex), the
  # redirect URI (<externalURL>/auth/callback), and links the app builds such as
  # invitations. It is explicit and not derived from the ingress host, so links
  # never depend on ingress specifics. Rendering fails if this is empty.
  externalURL: ""
  oidc:
    # -- OIDC client ID the app authenticates as. Spacefleet always uses its
    # bundled Dex (see the `dex` block) — there is no external-provider or
    # passthrough mode. The issuer is derived automatically (the app's own
    # origin + /dex), so there is no issuer knob here. Keep this in sync with
    # dex.clientID (the static client the chart registers in Dex).
    clientID: spacefleet
  # -- Max background jobs the worker process runs in parallel.
  workerConcurrency: 4
  # -- Whether users may create new organizations. On by default. Set to false
  # to lock the deployment down so only invited users (added to an existing
  # org) can use the app — a signed-in user with no organization is shown a
  # "request an invite" message instead of a create-organization screen.
  allowOrgCreation: true

  # SMTP for outbound email (today: organization invitation emails). Optional —
  # leave host or from empty to disable email, in which case invitations still
  # produce a copy-able link an admin shares manually. Whether email is enabled
  # (host+from set) is surfaced to the browser via /config.js so the invite UI
  # can word itself correctly. The password is a secret: set it inline here (it
  # lands in the chart's managed env Secret as SMTP_PASSWORD) or, for GitOps,
  # leave it empty and supply SMTP_PASSWORD via config.secrets.envFrom.
  smtp:
    # -- SMTP server hostname. Empty disables email.
    host: ""
    # -- SMTP server port (submission). 587 + STARTTLS is the usual setup.
    port: 587
    # -- SMTP auth username (optional; omit for unauthenticated relays).
    username: ""
    # -- Inline SMTP password. Prefer config.secrets.envFrom for GitOps.
    password: ""
    # -- Envelope From address, e.g. "Spacefleet <no-reply@example.com>".
    # Empty disables email.
    from: ""
    # -- Upgrade the connection with STARTTLS after connecting.
    startTLS: true

  # GitHub App for pulling Helm charts from private Git repositories. Register
  # one GitHub App (with "Contents: read" repository permission) and set its
  # Setup URL to "<your external URL>/github/callback" so the post-install
  # redirect lands back in the app. The App ID and slug are non-secret (inline);
  # the private key is a secret — set it inline here (it lands in the chart's
  # managed env Secret as GITHUB_APP_PRIVATE_KEY) or, for GitOps, leave it empty
  # and supply GITHUB_APP_PRIVATE_KEY via config.secrets.envFrom. Leave unset to
  # disable the feature (the git chart source then supports public repos only).
  github:
    # -- Numeric GitHub App ID. Empty disables the feature.
    appId: ""
    # -- GitHub App URL slug (github.com/apps/<slug>), used to build the install
    # link. Empty disables the feature.
    slug: ""
    # -- Inline GitHub App private key (PEM, or base64-encoded PEM). Prefer
    # config.secrets.envFrom for GitOps. Empty disables the feature.
    privateKey: ""

  # -- Extra environment variables for both web and worker pods. Standard
  # core/v1 EnvVar entries, e.g. [{name: FOO, value: bar}]. Plaintext — for
  # non-secret config only. Secrets go under `secrets` below.
  extraEnv: []

  # Secret application config. Unlike `extraEnv` (plaintext, for non-secrets),
  # these reach the web and worker pods from a Kubernetes Secret — never as
  # plain env in the rendered manifest. Two combinable ways to supply them:
  secrets:
    # -- Credential-encryption key: a base64-encoded 32-byte key. Generate one
    # with `openssl rand -base64 32`. Spacefleet uses it to envelope-encrypt
    # credentials it stores at rest (e.g. a registered cluster's token or
    # kubeconfig). WITHOUT it, registering any resource that carries a
    # credential fails fast with a clear error; features that store no secrets
    # keep working. When set here, the chart stores it in its managed Secret
    # and injects it as SPACEFLEET_SECRET_KEY. For GitOps, prefer leaving this
    # empty and supplying the key through `envFrom` from a Secret you manage.
    #
    # NOT ROTATABLE IN PLACE: changing this key makes every value already
    # encrypted with the old one unreadable. Set it once, back it up, and keep
    # it stable for the life of the data.
    secretKey: ""
    # -- Load secret env from Secrets you manage out of band (HashiCorp Vault,
    # External Secrets Operator, Sealed Secrets, or a hand-created Secret).
    # This is the scalable path for ALL secret config: put SPACEFLEET_SECRET_KEY
    # and any future secret env into your own Secret(s) and reference them here
    # — no chart change needed to add a new one. Standard core/v1 EnvFromSource
    # entries, applied to the web and worker pods. Example:
    #   - secretRef:
    #       name: spacefleet-app-secrets
    envFrom: []
  # -- Extra volumes mounted on the web, worker, AND migrate pods. Standard
  # core/v1 Volume entries. Pair with extraVolumeMounts to land custom TLS
  # assets — e.g. an RDS CA bundle for `sslmode=verify-full&sslrootcert=...`.
  # See docs/operator/database.md.
  extraVolumes: []
  # -- Extra volumeMounts for the app containers (web, worker, migrate).
  # Standard core/v1 VolumeMount entries referencing extraVolumes by name.
  extraVolumeMounts: []

# Web (the `serve` subcommand): stateless HTTP API + embedded SPA.
web:
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    # targetMemoryUtilizationPercentage: 80
  resources: {}
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
    # limits:
    #   memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Worker (the `worker` subcommand): River background-job processor.
worker:
  # -- Deploy the background worker. Disable if you have no registered jobs yet.
  enabled: true
  replicaCount: 1
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Database migrations (`migrate up`), run as a pre-install/pre-upgrade Helm
# hook Job before web/worker roll out.
migrations:
  enabled: true
  # -- Job backoffLimit (retries on failure, e.g. DB not yet reachable).
  backoffLimit: 6
  resources: {}
  annotations: {}
  # -- Scheduling for the migrate hook Job. This is a blocking install/upgrade
  # hook, so if your nodes are tainted or web/worker target a specific pool,
  # set these to match — otherwise an unschedulable migrate pod stalls the
  # whole release.
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  # -- Service port. Routes to the pod's targetPort.
  port: 80
  # -- Container port the app listens on. Must match config.addr.
  targetPort: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: spacefleet.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: spacefleet-tls
    #   hosts:
    #     - spacefleet.local

serviceAccount:
  create: true
  name: ""
  annotations: {}

clusterReader:
  # -- Render an OPT-IN, least-privilege cluster-scoped reader Role bound to the
  # app's ServiceAccount. DEFAULT OFF on purpose: the cluster Spacefleet is
  # INSTALLED INTO is often the multi-tenant control plane, and Spacefleet does
  # not need to read it to operate (registered clusters are org-scoped resources
  # carrying their own credentials). Enable ONLY if you intend the install
  # (host) cluster to ALSO be a monitored workload cluster. When true, renders a
  # ClusterRole granting get/list/watch on nodes, namespaces and pods plus get
  # on pods/log, and a ClusterRoleBinding to the app ServiceAccount.
  #
  # Requires a real, chart-owned ServiceAccount: keep serviceAccount.create=true
  # (or set serviceAccount.name). With serviceAccount.create=false and no
  # serviceAccount.name, the subject resolves to the namespace "default" SA, so
  # enabling this would grant cluster read to that SA instead — the chart fails
  # fast in that case.
  enabled: false

# Pod- and container-level security. Defaults match the distroless/static
# nonroot runtime image (uid/gid 65532, read-only rootfs, no privilege).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# HTTP probes against the public /api/health endpoint.
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

# ---------------------------------------------------------------------------
# Bundled Postgres — a single-replica StatefulSet running the official postgres
# image. Enabled by default for a one-command trial. For production, prefer
# postgresql.enabled=false + externalDatabase (a managed/HA database).
# ---------------------------------------------------------------------------
postgresql:
  enabled: true
  # -- Official Postgres image. Matches docker-compose for dev/prod parity.
  image: postgres:18-alpine
  imagePullPolicy: IfNotPresent
  auth:
    username: spacefleet
    # -- Bundled-Postgres password. CHANGE THIS for any real deployment, or
    # disable the bundle and use a managed database.
    password: spacefleet
    database: spacefleet
  persistence:
    enabled: true
    size: 8Gi
    # -- StorageClass for the data PVC. Empty uses the cluster default.
    storageClass: ""
  resources: {}
  # -- Pod securityContext for the Postgres pod. Empty lets the official image
  # manage its own user (root entrypoint → drops to postgres). Set fsGroup/
  # runAsUser to run under "restricted" PodSecurity (see README).
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Used only when postgresql.enabled=false. Provide a full DSN via `url`, or a
# reference to an existing Secret holding it.
externalDatabase:
  # -- Full Postgres DSN, e.g. postgres://user:pass@host:5432/db?sslmode=require
  url: ""
  # -- Name of an existing Secret containing the DSN (takes precedence over url).
  existingSecret: ""
  # -- Key within existingSecret holding the DSN.
  existingSecretKey: DATABASE_URL

# ---------------------------------------------------------------------------
# Bundled Dex — Spacefleet's identity provider, via the official dexidp/dex
# subchart. ALWAYS bundled: it's an internal part of the platform, not an
# optional add-on, so there is no enable/disable toggle. You don't point the app
# at an external IdP; instead you configure Dex's connectors (below) to federate
# to GitHub/Google/Okta/Entra/LDAP/SAML/etc. The app always trusts Dex.
#
# The app reverse-proxies Dex same-origin under /dex, so the issuer is derived
# as the app's own origin + /dex (https://<first ingress host>/dex with ingress,
# or http://localhost:8080/dex for a port-forward trial) — no issuer knob, no
# CORS, no separate Dex host to expose.
#
# This chart RENDERS Dex's config (the app's PKCE client + redirect URIs,
# storage, connectors) from the values below and hands it to the subchart as an
# existing Secret; the subchart owns the Deployment/Service/RBAC. Keys under
# `dex` that aren't listed here are passed straight through to the dexidp/dex
# subchart (resources, nodeSelector, image, autoscaling, …).
dex:
  # ---- Dex config rendered by this chart -------------------------------------

  # -- The app's OIDC client id registered in Dex. Keep in sync with
  # config.oidc.clientID. Registered as a public (PKCE) client, no secret.
  clientID: spacefleet
  # -- Signing/session storage: crd (Kubernetes CRDs, no DB) | postgres | memory
  # | sqlite3. crd is durable and HA-safe with no extra dependency. memory is
  # single-replica/trial only (new signing keys on every restart).
  storage: crd
  # -- Extra storage.config keys merged into the rendered config (e.g. a
  # postgres DSN for storage=postgres). For crd, {inCluster: true} is the default.
  storageConfig: {}

  # -- Seed Dex's local password DB so a fresh install is immediately loginnable.
  enablePasswordDB: true
  # -- Static users. The default seeds admin@example.com / "password" so trials
  # work out of the box. CHANGE THIS (or clear it and configure a connector)
  # before exposing the deployment — this is a publicly known credential.
  # Regenerate a hash with: htpasswd -bnBC 10 "" <pw> | tr -d ':\n'
  staticPasswords:
    - email: admin@example.com
      hash: "$2y$10$BFlbl0.lcQSwywdpBVArUuBjeOAgb37/kb7Lyy8I.rB08PxAKFV0m"
      username: admin
      userID: "5a9f6c2e-9b1a-4f3d-8c7b-2e4d6a8f0c11"

  # -- Upstream identity connectors (GitHub, Google, OIDC, LDAP, …), passed
  # through to Dex's `connectors:`. Dex expands $VAR references at load, so keep
  # client secrets out of values: reference them as env (see dex.envFrom below)
  # instead of inlining. Example (GitHub):
  #   connectors:
  #     - type: github
  #       id: github
  #       name: GitHub
  #       config:
  #         clientID: <oauth app id>
  #         clientSecret: $GITHUB_CLIENT_SECRET
  #         orgs: [{name: your-org}]
  #
  # The connector's OAuth callback (config.redirectURI) is auto-filled from the
  # issuer as https://<ingress host>/dex/callback for callback-based connector
  # types (github, gitlab, google, oidc, oauth, microsoft, bitbucketcloud, gitea,
  # linkedin, atlassian-crowd, openshift, saml) when you don't set one — register
  # that SAME URL as the callback in the upstream provider (e.g. a GitHub OAuth
  # App's "Authorization callback URL"). Set config.redirectURI explicitly only to
  # override (e.g. if you front Dex at a different URL); other types (ldap, …) are
  # left untouched.
  #
  # Each connector's id/name/type also drives the in-app login screen: the SPA
  # renders one "Continue with <name>" button per connector (plus an "Email and
  # password" button when enablePasswordDB is on) that deep-links to that
  # connector — so set a human-friendly `name`. This list is the single source
  # of truth for both Dex and the login buttons.
  connectors: []

  # -- Additional OIDC clients beyond the app's own (verbatim Dex staticClients).
  extraStaticClients: []
  # -- Extra redirect URIs for the app client, beyond the auto-derived
  # https://<each ingress host>/auth/callback.
  extraRedirectURIs: []
  # -- Dex oauth2 settings (passthrough). skipApprovalScreen avoids a consent
  # click for the first-party app.
  oauth2:
    skipApprovalScreen: true
  web:
    # -- CORS origins for browser→Dex calls. Not needed in normal operation:
    # the browser reaches Dex same-origin through the app's /dex proxy, so there
    # are no cross-origin calls. Left as a passthrough for unusual setups.
    allowedOrigins: []
  # -- Token/key lifetimes (Dex `expiry:` passthrough), e.g. {idTokens: 24h}.
  expiry: {}

  # ---- dexidp/dex subchart passthrough ---------------------------------------
  # This chart renders the config Secret, so the subchart must not create one;
  # both sides reference dex.configSecret.name. For multiple spacefleet releases
  # in one namespace, give each a unique name here.
  configSecret:
    create: false
    name: spacefleet-dex-config
  # RBAC defaults (create + createClusterScoped) grant the namespaced
  # dex.coreos.com role and the cluster-scoped CRD permissions that storage=crd
  # needs. For storage=postgres/memory you can set createClusterScoped=false.
  rbac:
    create: true
    createClusterScoped: true
  serviceAccount:
    create: true
  replicaCount: 1
  https:
    enabled: false
  grpc:
    enabled: false
  # -- envFrom for the Dex pod (subchart passthrough). Use this to inject
  # connector client secrets that the `connectors` config references as $VAR,
  # e.g. [{secretRef: {name: spacefleet-dex-connectors}}].
  envFrom: []
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
