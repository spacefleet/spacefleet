# Render coverage: production-style external Postgres, ingress + HPA on,
# secrets sourced from a user-managed Secret. Dex is still bundled (the issuer
# derives from the ingress host) — only the database is external here.
replicaCount: 3

config:
  # Public base URL — matches the ingress host below (the canonical origin).
  externalURL: "https://spacefleet.example.com"
  oidc:
    clientID: spacefleet
  # The GitOps path: SPACEFLEET_SECRET_KEY (and any other secret env) comes from
  # a Secret the operator manages out of band — no inline secretKey, so the
  # chart renders no env Secret of its own here (DB is external too).
  secrets:
    envFrom:
      - secretRef:
          name: spacefleet-app-secrets

web:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: spacefleet.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: spacefleet-tls
      hosts:
        - spacefleet.example.com

postgresql:
  enabled: false
externalDatabase:
  existingSecret: spacefleet-db
  existingSecretKey: DATABASE_URL
