# Render coverage: production-style external Postgres + Redis, ingress + HPA on,
# secrets sourced from a user-managed Secret. Dex is still bundled (the issuer
# derives from the ingress host) — only the datastores are external here.
replicaCount: 3

config:
  oidc:
    clientID: spacefleet

web:
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: spacefleet.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: spacefleet-tls
      hosts:
        - spacefleet.example.com

postgresql:
  enabled: false
externalDatabase:
  existingSecret: spacefleet-db
  existingSecretKey: DATABASE_URL

redis:
  enabled: false
externalRedis:
  url: redis://:s3cret@redis.example.com:6379/0
