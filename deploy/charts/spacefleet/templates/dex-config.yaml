{{- include "spacefleet.validate" . -}}
{{/*
Dex's config, rendered by this chart and handed to the dexidp/dex subchart as an
existing Secret (dex.configSecret.create=false). Owning the config here lets us
derive the issuer + the app's PKCE client/redirect URIs and inject connectors,
keeping a single source of truth with the app's OIDC_ISSUER env.

The config content itself lives in the "spacefleet.dex.config" template
(_dex-config.tpl), shared with dex-rollout-job.yaml — which restarts Dex when
this Secret's content changes, since Dex reads config only at startup.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.dex.configSecret.name }}
  labels:
    {{- include "spacefleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
type: Opaque
stringData:
  config.yaml: |
    {{- include "spacefleet.dex.config" . | nindent 4 }}
