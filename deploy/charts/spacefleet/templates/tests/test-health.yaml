apiVersion: v1
kind: Pod
metadata:
  name: {{ include "spacefleet.fullname" . }}-test-health
  labels:
    {{- include "spacefleet.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: busybox:1.36
      command: ["wget"]
      args:
        - "--spider"
        - "-S"
        - "http://{{ include "spacefleet.fullname" . }}:{{ .Values.service.port }}/api/health"
