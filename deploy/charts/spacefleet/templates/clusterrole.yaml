{{- if .Values.clusterReader.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "spacefleet.fullname" . }}-cluster-reader
  labels:
    {{- include "spacefleet.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "spacefleet.fullname" . }}-cluster-reader
  labels:
    {{- include "spacefleet.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "spacefleet.fullname" . }}-cluster-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "spacefleet.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
