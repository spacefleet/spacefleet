{{- if .Values.ingress.enabled }}
{{- $fullName := include "spacefleet.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $dexName := include "spacefleet.dex.fullname" . -}}
{{- $dexPath := "" -}}
{{- if .Values.dex.enabled -}}{{- $dexPath = (urlParse (include "spacefleet.oidc.issuer" .)).path -}}{{- end -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "spacefleet.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if and $.Values.dex.enabled $dexPath }}
          # Route the issuer path (e.g. /dex) to the bundled Dex Service so the
          # provider is same-origin with the app — listed first to win the
          # longest-prefix match over the app's "/".
          - path: {{ $dexPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $dexName }}
                port:
                  name: http
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
